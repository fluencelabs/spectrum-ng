apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  annotations:
    alpha.kubevirt.io/EmulatorThreadCompleteToEvenParity: ""
spec:
  configuration:
    # Node drain live-migrates VMIs instead of shutting them down. A VMI that
    # is not live-migratable (RWO disk) gets its eviction refused, so the drain
    # blocks rather than killing it. Copied into a VMI's spec at creation:
    # running VMIs keep their old value until the VM restarts.
    evictionStrategy: LiveMigrate
    migrations:
      # KubeVirt defaults for concurrency, set explicitly.
      parallelMigrationsPerCluster: 5
      parallelOutboundMigrationsPerNode: 2
      # Per cluster from spectrum-manual-vars; 0Mi = unlimited. How to choose
      # it: (граф `@cloudless/fluence`, узел #4321).
      bandwidthPerMigration: ${KUBEVIRT_MIGRATION_BANDWIDTH:=0Mi}
    virtualMachineOptions:
      disableSerialConsoleLog: {}
    network:
      binding:
        managedtap:
          domainAttachmentType: managedTap
    developerConfiguration:
      featureGates:
        - CPUManager
        - AlignCPUs
        - NUMA
        - ExpandDisks
        # Enable storage live-migration: lets KubeVirt mirror disks onto a new
        # PVC on a running VM (libvirt drive-mirror), so RWO→RWX conversion and
        # storage-class moves don't need downtime. Requires VolumesUpdateStrategy
        # set on the VM (`spec.updateVolumesStrategy: Migration`) plus a target
        # PVC with the desired accessModes/storageClass.
        - VolumesUpdateStrategy
        - VolumeMigration
