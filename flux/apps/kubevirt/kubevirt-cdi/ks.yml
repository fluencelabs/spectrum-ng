apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubevirt-cdi
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./flux/apps/kubevirt/kubevirt-cdi/app
  prune: false
  targetNamespace: kubevirt
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  dependsOn:
    - name: kubevirt-cdi-operator
    # The CDI resource points importers at the proxy (app/cdi.yml), so it is
    # applied only once the AdminNetworkPolicy, and so the proxy, are Ready. The
    # operator install (kubevirt-cdi-operator) does not wait. The proxy
    # setting cannot be a Kustomization of its own: two Kustomizations
    # applying one object share kustomize-controller's field manager, and
    # each apply would drop the other's fields.
    - name: smokescreen-admin-policy
