---
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: grafana
  namespace: observability
spec:
  name: spectrum-${NETWORK}-grafana
  ephemeral: true
---
apiVersion: netbird.io/v1alpha1
kind: SidecarProfile
metadata:
  name: grafana
  namespace: observability
spec:
  setupKeyRef:
    name: grafana
  podSelector:
    matchLabels:
      netbird.io/inject: "true"
  injectionMode: Container
  containerOverride:
    env:
      - name: NB_SETUP_KEY
        valueFrom:
          secretKeyRef:
            name: setup-key-grafana
            key: setup-key
      - name: NB_MANAGEMENT_URL
        value: https://netbird.infrahub.cloudless.dev
      - name: NB_LOG_FILE
        value: console
      - name: NB_DISABLE_PROFILES
        value: "true"
      - name: NB_DISABLE_UPDATE_SETTINGS
        value: "false"
      - name: NB_DAEMON_ADDR
        value: unix:///var/run/netbird/netbird.sock
      - name: NB_ENTRYPOINT_SERVICE_TIMEOUT
        value: "0"
      - name: NB_DNS_RESOLVER_ADDRESS
        value: "127.0.0.1:53"
