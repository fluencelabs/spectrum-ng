# NetBird mesh membership for the Grafana pod's injected sidecar (OIDC back-channel to
# authentik.infra).
#
# Two resources, both netbird.io/v1alpha1 — the current, non-deprecated API:
#  1. SetupKey — the operator MINTS a reusable+ephemeral setup key through the NetBird API (its
#     NB_API_KEY), writes it into a Secret it owns named `setup-key-<name>` (key `setup-key`), and
#     rotates it. Nothing is hand-created or copied.
#  2. SidecarProfile — tells the operator's pod webhook which pods to inject and which key to use.
#     Selection is by POD LABEL (`netbird.io/inject`), which replaces the legacy
#     `netbird.io/setup-key` annotation and its NBSetupKey shim; the whole NB* API is deprecated
#     upstream and takes no further fixes.
#
# The selector must stay narrow: an empty podSelector matches EVERY pod in the namespace, and
# `observability` also runs the VictoriaMetrics stack and kube-state-metrics, none of which belong
# on the mesh.
#
# injectionMode: Container is deliberate and must not be dropped to the `Sidecar` default. Native
# sidecar injection leaves the pod stuck (Init / no sandbox) under kube-ovn here; a regular
# container works, because grafana re-reads resolv.conf once netbird is up (per glibc).
#
# authentik.infra's policy source group is `All`, so this peer needs no extra autoGroups or policy.
# Do NOT force-remove the netbird CR finalizers on teardown.
---
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: grafana
  namespace: observability
spec:
  name: spectrum-${NETWORK}-grafana
  ephemeral: true
---
apiVersion: netbird.io/v1alpha1
kind: SidecarProfile
metadata:
  name: grafana
  namespace: observability
spec:
  setupKeyRef:
    name: grafana
  podSelector:
    matchLabels:
      netbird.io/inject: "true"
  injectionMode: Container
