# NVMe health on the LINSTOR storage nodes. A thin pool can span several NVMe
# disks with no mirror under it (mainnet poz-bey-c01-19 since 2026-11), so one
# failing disk takes every volume on that node with it; these fire while the
# drive still works.
#
# Metric names are those of smartctl_exporter v0.15.0 (chart 0.18.0). The
# NVMe ones come straight from smartctl's nvme_smart_health_information_log.
# Every rule aggregates by (node, device) so an exporter pod restart (new pod
# label) does not reset `for`.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: smartctl-exporter-alerts
spec:
  groups:
    - name: nvme.health.alerts
      rules:
        - alert: NvmeCriticalWarning
          expr: |
            max by (node, device) (smartctl_device_critical_warning) != 0
          for: 5m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.node }} raised a critical warning"
            description: "The controller of {{ $labels.device }} on {{ $labels.node }} sets critical_warning={{ $value }} in its health log. Bits: 1 spare below threshold, 2 temperature out of range, 4 reliability degraded by media or internal errors, 8 read-only mode, 16 volatile backup failed. Any of them means the disk is failing or about to. Move the LINSTOR replicas off this node before it gets worse; check with `smartctl -a /dev/{{ $labels.device }}` from the smartctl-exporter pod on that node."

        - alert: NvmeSmartStatusFailed
          expr: |
            max by (node, device) (smartctl_device_smart_status) == 0
          for: 5m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.node }} fails its SMART self-assessment"
            description: "smartctl reports the overall health of {{ $labels.device }} on {{ $labels.node }} as FAILED. Treat the disk as dying: move the LINSTOR replicas off this node and plan the replacement."

        - alert: NvmeMediaErrorsIncreasing
          expr: |
            max by (node, device) (smartctl_device_media_errors)
              - max by (node, device) (smartctl_device_media_errors offset 1h)
              > 0
          labels:
            team: devops
            severity: critical
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.node }} is reporting new media errors"
            description: "{{ $labels.device }} on {{ $labels.node }} logged {{ $value }} new unrecovered data-integrity errors (uncorrectable ECC, CRC, LBA tag mismatch) in the last hour. Data on it is already being lost or served from DRBD peers. Move the LINSTOR replicas off this node and replace the disk."

        - alert: NvmeWearHigh
          expr: |
            max by (node, device) (smartctl_device_percentage_used) > 80
          for: 1h
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.node }} has used {{ $value }}% of its rated endurance"
            description: "percentage_used on {{ $labels.device }} ({{ $labels.node }}) is {{ $value }}%: the vendor's estimate of rated write endurance consumed. It reaches 100 at end of rated life and can exceed it. Plan the replacement."

        - alert: NvmeAvailableSpareLow
          expr: |
            max by (node, device) (smartctl_device_available_spare)
              <= 2 * max by (node, device) (smartctl_device_available_spare_threshold)
          for: 15m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.node }} is running out of spare blocks"
            description: "available_spare on {{ $labels.device }} ({{ $labels.node }}) is {{ $value }}%, within twice the vendor threshold. The drive is retiring blocks; once it crosses the threshold it raises a critical warning and may go read-only. Plan the replacement."

        - alert: NvmeAvailableSpareBelowThreshold
          expr: |
            max by (node, device) (smartctl_device_available_spare)
              < max by (node, device) (smartctl_device_available_spare_threshold)
          for: 5m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.node }} is below its spare threshold"
            description: "available_spare on {{ $labels.device }} ({{ $labels.node }}) is {{ $value }}%, below the vendor threshold. The drive may switch to read-only at any time. Move the LINSTOR replicas off this node now."

        - alert: NvmeTemperatureHigh
          expr: |
            max by (node, device) (smartctl_device_temperature{temperature_type="current"}) > 70
          for: 15m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.node }} is at {{ $value }}°C"
            description: "{{ $labels.device }} on {{ $labels.node }} has been above 70°C for 15 minutes. Data-centre NVMe throttles near its warning temperature (typically 70-80°C), which shows up as DRBD and VM I/O latency. Check the chassis airflow and fans."

    - name: smartctl-exporter.alerts
      rules:
        # Every node with a diskful LINSTOR pool must be reporting disk health,
        # or a degrading disk there is invisible. Covers the pod missing, not
        # scheduled, and the scrape failing.
        - alert: SmartctlExporterMissing
          expr: |
            max by (node) (linstor_storage_pool_capacity_total_bytes > 0)
              unless on (node)
            max by (node) (up{job="smartctl-exporter"} == 1)
          for: 15m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "No disk-health data from storage node {{ $labels.node }}"
            description: "{{ $labels.node }} holds a LINSTOR storage pool but no smartctl-exporter target there has been up for 15 minutes, so no NVMe alert can fire for it. Check the smartctl-exporter DaemonSet in observability (the node needs the beam/linstor_ready=true label) and its pod logs."

        # The exporter is up but does not see every NVMe controller the kernel
        # has (smartctl cannot open it, or it was filtered out). The `or ... * 0`
        # branch gives a node whose exporter is up but sees no NVMe at all a
        # count of 0, so that case fires too.
        - alert: SmartctlExporterMissingDisk
          expr: |
            count by (node) (node_nvme_info)
              > on (node)
            (
              count by (node) (max by (node, device) (smartctl_device{interface="nvme"}))
                or
              max by (node) (up{job="smartctl-exporter"} == 1) * 0
            )
          for: 30m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "smartctl-exporter on {{ $labels.node }} does not see every NVMe disk"
            description: "node-exporter lists more NVMe controllers on {{ $labels.node }} than smartctl-exporter reports, so the health of at least one disk is not watched. Compare `node_nvme_info{node=\"{{ $labels.node }}\"}` with `smartctl_device{node=\"{{ $labels.node }}\"}` and check the exporter pod logs."
