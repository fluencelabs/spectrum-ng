apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  path: ./flux/apps/observability/alloy/app
  prune: true
  targetNamespace: observability
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    # LOG_HASH_SALT for app/logs/log-hash-salt.yml. Not optional, so a cluster without the
    # Secret fails this build; a Secret without the key still renders an empty salt.
    substituteFrom:
      - kind: Secret
        name: spectrum-manual-secrets
        optional: false
  dependsOn:
    - name: alloy-operator
