apiVersion: collectors.grafana.com/v1alpha1
kind: Alloy
metadata:
  name: alloy-logs
spec:
  controller:
    type: daemonset
    tolerations:
      - effect: NoSchedule
        operator: Exists
  alloy:
    enableReporting: false
    mounts:
      varlog: true
    configMap:
      content: |-
        logging {
          level  = "info"
          format = "logfmt"
        }

        // DISCOVERY
        discovery.kubernetes "pod" {
          role = "pod"
        }

        // RELABELING
        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pod.targets

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            regex = "guest-console-log"
            action = "drop"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label = "app"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
            separator = "/"
            replacement = "$1"
            target_label = "job"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator = "/"
            replacement = "/var/log/pods/*$1/*.log"
            target_label = "__path__"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_id"]
            target_label = "container_runtime"
            regex = "^(\\S+):\\/\\/.+$"
            replacement = "$1"
          }
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.process.flow_records.receiver]
        }

        // CEILING ON FLOW RECORDS
        // goflow2 (kube-system, flux/apps/kube-system/kube-ovn/flows) writes
        // one JSON line per flow record. In steady state that is a few lines a
        // second per node; under a fast scan the eBPF probe keeps every SYN
        // unsampled and would produce one line per probed host — 100k/s and
        // more — right when VictoriaLogs' disk cap would start evicting every
        // other log in the cluster to make room. 500 lines/s per node is 100x
        // steady state and ~1.3 GB/day on disk at worst; a fast scan is caught
        // by the volumetric stage-one alerts anyway, its dropped records are not
        // needed. Nothing else matches the selector on clusters without probes.
        loki.process "flow_records" {
          stage.match {
            selector = "{namespace=\"kube-system\", container=~\"ovs|ebpf\"}"
            stage.limit {
              rate  = 500
              burst = 2000
              drop  = true
            }
          }
          forward_to = [loki.process.crd_operator.receiver]
        }

        // PARSE JSON FOR CRD OPERATOR CONTAINERS
        loki.process "crd_operator" {
          stage.match {
            selector = "{namespace=\"fluence\", container=~\"controller|api|admission-controller\"}"
            stage.json {
              expressions = {
                level     = "level",
                message   = "fields.message",
                timestamp = "timestamp",
              }
            }
            stage.labels {
              values = {
                level   = "level",
                message = "message",
              }
            }
            stage.timestamp {
              source = "timestamp"
              format = "RFC3339Nano"
            }
          }
          forward_to = [loki.write.victorialogs.receiver]
        }

        // WRITING
        loki.write "victorialogs" {
          endpoint {
            url = "http://vlogs-stack.observability.svc:9428/insert/loki/api/v1/push"
          }
        }
