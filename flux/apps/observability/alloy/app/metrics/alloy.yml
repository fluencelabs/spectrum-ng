apiVersion: collectors.grafana.com/v1alpha1
kind: Alloy
metadata:
  name: alloy-metrics
spec:
  controller:
    type: statefulset
    replicas: 1
  alloy:
    enableReporting: false
    extraEnv:
      - name: CLUSTER
        value: spectrum
    configMap:
      content: |-
        logging {
          level  = "info"
          format = "logfmt"
        }
        
        // MODULES
        // Annotations
        import.git "metric_annotations" {
          repository = "https://github.com/grafana/alloy-modules.git"
          revision = "v0.2.11"
          path = "modules/kubernetes/annotations/metrics.alloy"
          pull_frequency = "15m"
        }

        metric_annotations.kubernetes "targets" {
          role = "endpoints"
          annotation = "metrics.grafana.com"
        }

        metric_annotations.metrics "scrape" {
          targets = metric_annotations.kubernetes.targets.output
          forward_to = [prometheus.relabel.relable.receiver]
        }

        // K8S Core
        import.git "k8s" {
          repository = "https://github.com/grafana/alloy-modules.git"
          revision = "v0.2.11"
          path = "modules/kubernetes/core/metrics.alloy"
          pull_frequency = "15m"
        }
        
        // cAdvisor, scraped from each kubelet directly rather than through the
        // k8s.cadvisor module. The module goes via the apiserver node proxy,
        // which needs nodes/proxy; the Alloy chart dropped that rule upstream
        // (it also lets the holder exec into pods through the kubelet), so the
        // module only gets 403 since alloy-operator 0.8.0. A direct kubelet
        // scrape is authorized by nodes/metrics, which the chart does grant.
        discovery.kubernetes "cadvisor" {
          role = "node"
        }

        discovery.relabel "cadvisor" {
          targets = discovery.kubernetes.cadvisor.targets

          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            target_label  = "node"
          }
          rule {
            target_label = "__metrics_path__"
            replacement  = "/metrics/cadvisor"
          }
          rule {
            target_label = "source"
            replacement  = "kubernetes"
          }
        }

        prometheus.scrape "cadvisor" {
          targets           = discovery.relabel.cadvisor.output
          job_name          = "integrations/kubernetes/cadvisor"
          scheme            = "https"
          scrape_interval   = "60s"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

          // Kubelet serving certificates are self-signed (no serverTLSBootstrap).
          tls_config {
            insecure_skip_verify = true
          }

          forward_to = [prometheus.relabel.cadvisor.receiver]
        }

        // Per-container memory and CPU in every namespace: four series per
        // container, enough to size requests and limits from history.
        prometheus.relabel "cadvisor" {
          rule {
            source_labels = ["__name__"]
            regex         = "up|container_(cpu_usage_seconds_total|memory_(rss|working_set_bytes)|oom_events_total)"
            action        = "keep"
          }
          // Pod- and node-level cgroups and pause containers carry no container
          // label; drop them, and series without an image (google/cadvisor#2688).
          rule {
            source_labels = ["__name__", "container"]
            separator     = "@"
            regex         = "container_.*@"
            action        = "drop"
          }
          rule {
            source_labels = ["__name__", "image"]
            separator     = "@"
            regex         = "container_.*@"
            action        = "drop"
          }

          forward_to = [prometheus.relabel.relable.receiver]
        }
        
        k8s.resources "scrape" {
          forward_to = [prometheus.relabel.relable.receiver]
        }
        
        k8s.apiserver "scrape" {
          forward_to = [prometheus.relabel.relable.receiver]
        }
        
        k8s.probes "scrape" {
          forward_to = [prometheus.relabel.relable.receiver]
        }
        
        k8s.kube_dns "scrape" {
          forward_to = [prometheus.relabel.relable.receiver]
        }
        
        k8s.kubelet "scrape" {
          forward_to = [prometheus.relabel.relable.receiver]
        }

        // node-exporter
        import.git "node_exporter" {
          repository     = "https://github.com/grafana/alloy-modules.git"
          revision       = "v0.2.11"
          path           = "modules/system/node-exporter/metrics.alloy"
          pull_frequency = "15m"
        }

        node_exporter.kubernetes "targets" {}

        discovery.relabel "nodeexporter_targets" {
          targets = node_exporter.kubernetes.targets.output

          rule {
            action        = "replace"
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "nodename"
            regex         = "(.+)"
            replacement   = "$1"
          }
          rule {
            action        = "replace"
            source_labels = ["__meta_kubernetes_endpoint_node_name"]
            target_label  = "nodename"
            regex         = "(.+)"
            replacement   = "$1"
          }
          rule {
            action        = "replace"
            source_labels = ["__meta_kubernetes_endpointslice_endpoint_node_name"]
            target_label  = "nodename"
            regex         = "(.+)"
            replacement   = "$1"
          }
          rule {
            action        = "replace"
            source_labels = ["__meta_kubernetes_endpointslice_endpoint_topology_kubernetes_io_hostname"]
            target_label  = "nodename"
            regex         = "(.+)"
            replacement   = "$1"
          }
          rule {
            action        = "replace"
            source_labels = ["nodename"]
            target_label  = "node"
          }
          rule {
            action        = "replace"
            source_labels = ["nodename"]
            target_label  = "instance"
          }
        }

        prometheus.scrape "nodeexporter" {
          targets    = discovery.relabel.nodeexporter_targets.output
          job_name   = "node"
          forward_to = [prometheus.relabel.relable.receiver]
        }

        // DISCOVERY
        prometheus.operator.servicemonitors "services" {
          forward_to = [prometheus.relabel.relable.receiver]
          selector {
            match_labels = {scrape = "true"}
          }
        }

        prometheus.operator.podmonitors "podmonitors" {
          forward_to = [prometheus.relabel.relable.receiver]
        }

        // KUBE-OVN
        prometheus.operator.servicemonitors "kube_ovn" {
          selector { match_labels = { app = "kube-ovn" } }

          rule {
            action        = "replace"
            source_labels = ["__meta_kubernetes_pod_node_name","__meta_kubernetes_endpoint_node_name","__meta_kubernetes_endpointslice_endpoint_node_name","__meta_kubernetes_endpointslice_endpoint_topology_kubernetes_io_hostname"]
            separator     = ";"
            regex         = "^(?:;*)?([^;]+).*$"
            replacement   = "$1"
            target_label  = "instance"
          }

          forward_to = [prometheus.relabel.relable.receiver]
        }

                
        // SELF-MONITORING
        prometheus.exporter.self "default" { }
        
        prometheus.scrape "metamonitoring" {
          targets    = prometheus.exporter.self.default.targets
          forward_to = [prometheus.relabel.relable.receiver]
        }
        
        // RELABELING
        prometheus.relabel "relable" {
          rule {
            action = "replace"
            target_label = "cluster"
            replacement = env("CLUSTER")
          }
          forward_to = [prometheus.remote_write.victoriametrics.receiver]
        }

        
        // WRITING
        prometheus.remote_write "victoriametrics" {
          endpoint {
            url = "http://vmsingle-stack.observability.svc:8429/prometheus/api/v1/write"
          }
        }
