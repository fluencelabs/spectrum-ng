apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: prometheus-node-exporter
    namespace: flux-system
  values:
    fullnameOverride: node-exporter

    image:
      registry: quay.io
      repository: prometheus/node-exporter

    # node-exporter 1.13 refuses --collector.filesystem.ignored-mount-points next to the
    # chart's --collector.filesystem.mount-points-exclude (mutually exclusive, panic at start),
    # so the mount filter replaces the chart default here; fs-types-exclude is the chart default.
    defaultArgs:
      - --collector.filesystem.mount-points-exclude=^/(run|etc|dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/pods/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$

    extraArgs:
      - --no-collector.wifi
      - --no-collector.btrfs
      - --no-collector.dmi
      - --no-collector.fibrechannel
      - --no-collector.hwmon
      - --no-collector.infiniband
      - --no-collector.powersupplyclass
      - --no-collector.thermal_zone
      - --no-collector.zfs
      - --collector.netclass.ignored-devices=^(veth.*)$

    prometheus:
      monitor:
        enabled: true

    resources:
      requests:
        cpu: 23m
        memory: 64M
      limits:
        memory: 256M

    hostNetwork: false
