apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: stack
spec:
  replicaCount: 1
  externalLabels:
    cluster_id: "${CLUSTER_ID}"
    network: ${NETWORK}
  datasource:
    url: "http://vmsingle-stack.observability.svc:8429"
  notifier:
    url: "http://vmalertmanager-stack.observability.svc:9093"
  remoteWrite:
    url: "http://vmsingle-stack.observability.svc:8429"
  remoteRead:
    url: "http://vmsingle-stack.observability.svc:8429"
  evaluationInterval: "30s"
  selectAllByDefault: true
  # Take every VMRule EXCEPT the vlogs-typed ones. Those carry LogsQL
  # expressions and belong to the stack-logs instance, which queries
  # vlogs; evaluated here they are sent to vmsingle, which answers 400 and
  # leaves the rule permanently in health=err. They still fire correctly
  # from stack-logs — this only stops the doomed second copy.
  ruleSelector:
    matchExpressions:
      - key: rule-type
        operator: NotIn
        values: ["vlogs"]
