apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kube-state-metrics
    namespace: flux-system
  values:
    fullnameOverride: kube-state-metrics

    prometheus:
      monitor:
        enabled: true
        additionalLabels:
          scrape: "true"

    rbac:
      extraRules:
        - apiGroups: ["kubevirt.io"]
          resources: ["virtualmachines"]
          verbs: ["list", "watch"]
        - apiGroups: ["cloudless.dev"]
          resources: ["workspaces", "storages", "vpcs", "subnets", "public-ips", "virtualmachines", "security-groups"]
          verbs: ["list", "watch"]
        - apiGroups: ["kubeovn.io"]
          resources: ["provider-networks"]
          verbs: ["list", "watch"]
        - apiGroups: ["netbird.io"]
          resources: ["nbresources"]
          verbs: ["list", "watch"]

    customResourceState:
      enabled: true
      config:
        spec:
          resources:
            - groupVersionKind:
                group: kubevirt.io
                version: v1
                kind: VirtualMachine
              labelsFromPath:
                name: [metadata, name]
                namespace: [metadata, namespace]
                vm_id: [metadata, annotations, "vm.cloudless.dev/id"]
                workspace_id: [metadata, annotations, "workspace.cloudless.dev/id"]
              metrics:
                - name: kubevirt_vm_annotation_info
                  help: "KubeVirt VM annotation info"
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        status: [status, printableStatus]

            - groupVersionKind:
                group: cloudless.dev
                version: v1alpha1
                kind: Workspace
              labelsFromPath:
                name: [metadata, name]
              metrics:
                - name: cloudless_workspace_condition
                  help: "cloudless.dev Workspace condition"
                  each:
                    type: Gauge
                    gauge:
                      nilIsZero: true
                      path: [status, conditions]
                      valueFrom: [status]
                      labelsFromPath:
                        condition_type: [type]
                        condition_status: [status]
                        condition_reason: [reason]

            - groupVersionKind:
                group: cloudless.dev
                version: v1alpha1
                kind: Storage
              labelsFromPath:
                name: [metadata, name]
                workspace: [spec, workspace]
              metrics:
                - name: cloudless_storage_condition
                  help: "cloudless.dev Storage condition"
                  each:
                    type: Gauge
                    gauge:
                      nilIsZero: true
                      path: [status, conditions]
                      valueFrom: [status]
                      labelsFromPath:
                        condition_type: [type]
                        condition_status: [status]
                        condition_reason: [reason]

            - groupVersionKind:
                group: cloudless.dev
                version: v1alpha1
                kind: Vpc
              labelsFromPath:
                name: [metadata, name]
                workspace: [spec, workspace]
              metrics:
                - name: cloudless_vpc_condition
                  help: "cloudless.dev Vpc condition"
                  each:
                    type: Gauge
                    gauge:
                      nilIsZero: true
                      path: [status, conditions]
                      valueFrom: [status]
                      labelsFromPath:
                        condition_type: [type]
                        condition_status: [status]
                        condition_reason: [reason]

            - groupVersionKind:
                group: cloudless.dev
                version: v1alpha1
                kind: Subnet
              labelsFromPath:
                name: [metadata, name]
                workspace: [spec, workspace]
              metrics:
                - name: cloudless_subnet_condition
                  help: "cloudless.dev Subnet condition"
                  each:
                    type: Gauge
                    gauge:
                      nilIsZero: true
                      path: [status, conditions]
                      valueFrom: [status]
                      labelsFromPath:
                        condition_type: [type]
                        condition_status: [status]
                        condition_reason: [reason]

            - groupVersionKind:
                group: cloudless.dev
                version: v1alpha1
                kind: PublicIp
              labelsFromPath:
                name: [metadata, name]
                workspace: [spec, workspace]
              metrics:
                - name: cloudless_publicip_condition
                  help: "cloudless.dev PublicIp condition"
                  each:
                    type: Gauge
                    gauge:
                      nilIsZero: true
                      path: [status, conditions]
                      valueFrom: [status]
                      labelsFromPath:
                        condition_type: [type]
                        condition_status: [status]
                        condition_reason: [reason]

            - groupVersionKind:
                group: cloudless.dev
                version: v1alpha1
                kind: VirtualMachine
              labelsFromPath:
                vm_id: [metadata, name]
                workspace_id: [spec, workspace]
                kubevirt_vm: [status, subresourceName]
              metrics:
                - name: cloudless_vm_condition
                  help: "cloudless.dev VirtualMachine condition"
                  each:
                    type: Gauge
                    gauge:
                      nilIsZero: true
                      path: [status, conditions]
                      valueFrom: [status]
                      labelsFromPath:
                        condition_type: [type]
                        condition_status: [status]
                        condition_reason: [reason]

            - groupVersionKind:
                group: cloudless.dev
                version: v1alpha1
                kind: SecurityGroup
              labelsFromPath:
                name: [metadata, name]
                workspace: [spec, workspace]
              metrics:
                - name: cloudless_securitygroup_condition
                  help: "cloudless.dev SecurityGroup condition"
                  each:
                    type: Gauge
                    gauge:
                      nilIsZero: true
                      path: [status, conditions]
                      valueFrom: [status]
                      labelsFromPath:
                        condition_type: [type]
                        condition_status: [status]
                        condition_reason: [reason]

            # ProviderNetwork carries one condition PER NODE (each entry has its
            # own `node` field), so a network can be Ready cluster-wide while a
            # single node fails to build its OVS bridge. That per-node failure is
            # what the ProviderNetworkNodeNotReady alert watches — nothing else
            # surfaces it: the kube-ovn/OVS components stay healthy and the k8s
            # Node stays Ready, only VLAN-backed traffic on that node is dead.
            - groupVersionKind:
                group: kubeovn.io
                version: v1
                kind: ProviderNetwork
              labelsFromPath:
                name: [metadata, name]
              metrics:
                - name: kubeovn_providernetwork_condition
                  help: "kube-ovn ProviderNetwork per-node condition"
                  each:
                    type: Gauge
                    gauge:
                      nilIsZero: true
                      path: [status, conditions]
                      valueFrom: [status]
                      labelsFromPath:
                        node: [node]
                        condition_type: [type]
                        condition_status: [status]
                        condition_reason: [reason]

            # The netbird-operator creates a record in NetBird and only then patches the
            # id into `status.NetworkResourceID`. If that patch does not land (pod
            # restart, lost leadership, API hiccup) the record exists but nothing owns
            # it, and it is left with `groups: null` — bound to no group, so it is
            # distributed to no peer and its mesh name silently stops resolving. Every
            # later reconcile tries to CREATE it again, gets 409, and the CR sits at
            # Ready=False/DuplicateName forever; adoption by name is not implemented;
            # nothing else anywhere reports it. On poz-bey-c01 all four NBResources
            # (k8s, k8s-spectrum, grafana, grafana-spectrum) were stuck that way and it
            # only surfaced on 2026-08-23 when someone tried to use the cluster. This
            # gauge is the only signal for that state. Recovery is manual: delete the
            # orphaned record via the NetBird API, then restart the operator — it does
            # not observe the deletion and sits in exponential backoff.
            - groupVersionKind:
                group: netbird.io
                version: v1
                kind: NBResource
              labelsFromPath:
                name: [metadata, name]
                namespace: [metadata, namespace]
                resource_name: [spec, name]
              metrics:
                - name: netbird_nbresource_condition
                  help: "netbird.io NBResource condition"
                  each:
                    type: Gauge
                    gauge:
                      nilIsZero: true
                      path: [status, conditions]
                      valueFrom: [status]
                      labelsFromPath:
                        condition_type: [type]
                        condition_status: [status]
                        condition_reason: [reason]
