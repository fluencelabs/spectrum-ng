# Per-cluster NetBird setup against the shared management at netbird.infrahub.cloudless.dev:
#   1. adds this cluster's routing peers to the spectrum-${NETWORK} group (policy destination);
#   2. deletes this cluster's legacy service-CIDR route and nameserver group left by earlier
#      versions. Mesh access is the operator's Network + NBResources (netbird-operator-config,
#      netbird-services); this Job creates no routes and no DNS config.
apiVersion: batch/v1
kind: Job
metadata:
  name: netbird-setup
  namespace: networking
  annotations:
    helm.sh/hook-delete-policy: before-hook-creation
    # A Job pod template is immutable; let Flux recreate it on spec changes.
    kustomize.toolkit.fluxcd.io/force: "Enabled"
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 30
  template:
    spec:
      containers:
        - name: setup
          image: python:3-alpine
          command: ["python3", "-c"]
          args:
            - |
              import json, os, urllib.request, urllib.error, ssl, time

              API_URL = "https://netbird.infrahub.cloudless.dev/api"
              TOKEN = os.environ["NB_API_KEY"]
              CLUSTER_ID = os.environ["CLUSTER_ID"]
              NETWORK = os.environ["NETWORK"]

              ctx = ssl.create_default_context()

              def api(method, path, data=None):
                  body = json.dumps(data).encode() if data else None
                  req = urllib.request.Request(
                      f"{API_URL}/{path}",
                      data=body,
                      method=method,
                      headers={
                          "Authorization": f"Token {TOKEN}",
                          "Content-Type": "application/json",
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, context=ctx) as resp:
                          raw = resp.read()
                          return json.loads(raw) if raw.strip() else {}
                  except urllib.error.HTTPError as e:
                      print(f"API error {e.code}: {e.read().decode()}")
                      raise

              def find_group(name, groups):
                  return next((g for g in groups if g["name"] == name), None)

              # Wait for router group to appear (operator creates it async)
              router_group = None
              for attempt in range(30):
                  groups = api("GET", "groups")
                  router_group = next(
                      (g for g in groups
                       if g["name"].startswith(f"spectrum-{NETWORK}-{CLUSTER_ID}")
                       and g.get("peers_count", 0) > 0),
                      None,
                  )
                  if router_group:
                      break
                  print(f"Waiting for router group... (attempt {attempt + 1}/30)")
                  time.sleep(10)

              if not router_group:
                  raise SystemExit("Error: router group not found after 5 minutes")
              print(f"Found router group: {router_group['name']} ({router_group['id']})")

              # Find spectrum-{NETWORK} group
              env_group = find_group(f"spectrum-{NETWORK}", groups)
              if not env_group:
                  raise SystemExit(f"Error: spectrum-{NETWORK} group not found")
              print(f"Found env group: {env_group['id']}")

              # --- 1. Add router peers to spectrum-{NETWORK} group ---
              router_peer_ids = [p["id"] for p in router_group.get("peers", []) or []]
              env_peer_ids = [p["id"] for p in env_group.get("peers", []) or []]
              missing = [pid for pid in router_peer_ids if pid not in env_peer_ids]
              if missing:
                  all_peers = list(set(env_peer_ids + router_peer_ids))
                  # PUT replaces the whole group: send its network resources back too, or every
                  # NBResource drops out of spectrum-{NETWORK}, the access policy matches nothing
                  # and the cluster vanishes from the mesh until the operator next reconciles.
                  resources = [
                      {"id": r["id"], "type": r["type"]}
                      for r in env_group.get("resources", []) or []
                  ]
                  api("PUT", f"groups/{env_group['id']}", {
                      "name": env_group["name"],
                      "peers": all_peers,
                      "resources": resources,
                  })
                  print(f"Added {len(missing)} router peers to {env_group['name']}")
              else:
                  print(f"Router peers already in {env_group['name']}")

              # --- 2. Remove this cluster's legacy service-CIDR route and nameserver group ---
              # Earlier versions of this Job (and the removed netbird-route-setup Job) created a
              # /12 route to the cluster's service CIDR and a nameserver group pointing at its
              # CoreDNS ClusterIP, both distributed to `support`. Clusters share service CIDRs
              # (10.112.0.0/12 on stage, testnet and mainnet poz-bey-c01), so support peers got
              # several identical routes and sent service-IP traffic and .spectrum DNS to a random
              # cluster. Mesh access now goes through the operator's NetBird Network (NBRoutingPeer
              # + NBResources): k8s/grafana .spectrum names are domain resources resolved by the
              # routing peer. Delete only what this Job created for THIS cluster, matched by the
              # exact name and the exact description the Job wrote. Idempotent: absent -> no-op.
              route_id = f"sp-{NETWORK}-{CLUSTER_ID[:8]}-svc"
              route_desc = f"Service CIDR for spectrum {NETWORK} cluster {CLUSTER_ID}"
              for r in api("GET", "routes"):
                  if r.get("network_id") != route_id:
                      continue
                  desc = r.get("description") or ""
                  if desc != route_desc:
                      print(f"Legacy route cleanup: SKIP route {r['id']} ({route_id}): "
                            f"description {desc!r} is not {route_desc!r}")
                      continue
                  print(f"Legacy route cleanup: deleting route {r['id']} "
                        f"network_id={route_id} network={r.get('network')} ({desc})")
                  api("DELETE", f"routes/{r['id']}")
                  print(f"Legacy route cleanup: deleted route {r['id']}")
              print(f"Legacy route cleanup: done for {route_id}")

              ns_name = f"sp-{NETWORK}-{CLUSTER_ID[:8]}-dns"
              ns_desc = f"DNS for spectrum {NETWORK} cluster {CLUSTER_ID}"
              ns_domains = [f"{CLUSTER_ID}.{NETWORK}.spectrum"]
              for ns in api("GET", "dns/nameservers"):
                  if ns.get("name") != ns_name:
                      continue
                  if ns.get("description") != ns_desc or ns.get("domains") != ns_domains:
                      print(f"Legacy nameserver cleanup: SKIP group {ns['id']} ({ns_name}): "
                            f"description/domains {ns.get('description')!r} {ns.get('domains')} "
                            f"do not match what this Job created")
                      continue
                  ips = [n.get("ip") for n in ns.get("nameservers") or []]
                  print(f"Legacy nameserver cleanup: deleting group {ns['id']} "
                        f"name={ns_name} domains={ns_domains} nameservers={ips}")
                  api("DELETE", f"dns/nameservers/{ns['id']}")
                  print(f"Legacy nameserver cleanup: deleted group {ns['id']}")
              print(f"Legacy nameserver cleanup: done for {ns_name}")

              print("Setup complete")
          env:
            - name: NB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-api-token
                  key: NB_API_KEY
            - name: CLUSTER_ID
              value: "${CLUSTER_ID}"
            - name: NETWORK
              value: "${NETWORK}"
      restartPolicy: Never
