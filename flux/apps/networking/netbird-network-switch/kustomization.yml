# Switches a cluster's mesh to the v1alpha1 Network API: adds netbird-network and drops the v1
# path. Include it from clusters/<cluster> (components:) only once infra has created the cluster's
# DNS zone and the network's access policy, together with the no-v1 component of
# netbird-operator-config for that network; the live v1 objects are removed by hand (graph
# @cloudless/fluence, node #2376).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ../netbird-network
patches:
  # The cluster reaches grafana and kube-oidc-proxy only through the v1alpha1 Network API
  # (netbird-network). The v1 path is dropped: no NBResource Jobs or exposed Services
  # (netbird-services-*), and no netbird-setup, whose only remaining job was adding the v1 router's
  # peers to spectrum-<network>. Access policy and groups are infra's (crossplane).
  - patch: |
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: netbird-setup
        namespace: flux-system
  - patch: |
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: netbird-services-grafana
        namespace: flux-system
  - patch: |
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: netbird-services-kube-oidc-proxy
        namespace: flux-system
  # netbird-token-rotate waited on netbird-setup; now it needs only the operator.
  - target:
      kind: Kustomization
      name: netbird-token-rotate
    patch: |
      - op: replace
        path: /spec/dependsOn
        value:
          - name: netbird-operator
  # Grafana's public URL is the name the NetworkResource publishes in the cluster's zone. `$$`
  # escapes the root `spectrum` ks substitution (it reads only spectrum-vars, which has no
  # CLUSTER_ID); the variables are filled in by the grafana ks postBuild.
  - target:
      kind: Kustomization
      name: grafana
    patch: |
      - op: add
        path: /spec/patches
        value:
          - target:
              kind: Grafana
              name: grafana
            patch: |
              - op: replace
                path: /spec/config/server/root_url
                value: "https://grafana-service.observability.$${CLUSTER_ID}.$${NETWORK}.spectrum"
