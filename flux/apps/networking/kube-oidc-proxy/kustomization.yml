apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Mesh exposure (kube-oidc-proxy.kube-oidc-proxy.<id>.<net>.spectrum) is a NetworkResource in
  # flux/apps/networking/netbird-network. Per-cluster prereqs: Authentik app spectrum-kube-<network>
  # (infra spectrum_kube_networks), KUBE_OIDC_* in spectrum-manual-vars, and the
  # fluence-mesh-intermediate bootstrap secret in this namespace.
  - ks.yml
