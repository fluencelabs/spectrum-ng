---
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: kube-oidc-proxy
  namespace: kube-oidc-proxy
spec:
  name: spectrum-${NETWORK}-kube-oidc-proxy
  ephemeral: true
---
apiVersion: netbird.io/v1alpha1
kind: SidecarProfile
metadata:
  name: kube-oidc-proxy
  namespace: kube-oidc-proxy
spec:
  setupKeyRef:
    name: kube-oidc-proxy
  podSelector:
    matchLabels:
      netbird.io/inject: "true"
  injectionMode: Container
  containerOverride:
    command:
      - env
      - NB_DISABLE_UPDATE_SETTINGS=false
      - NB_DNS_RESOLVER_ADDRESS=127.0.0.1:53
      - /usr/local/bin/netbird-entrypoint.sh
