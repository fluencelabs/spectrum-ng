# NetBird mesh membership for the proxy pod's injected sidecar (OIDC back-channel to
# authentik.infra). Mirrors flux/apps/observability/grafana/app/netbird-setupkey.yml — see there for
# the full reasoning; the same constraints apply.
#
# Both resources are netbird.io/v1alpha1: SetupKey mints and rotates the key into an operator-owned
# Secret, SidecarProfile selects the pods to inject by the `netbird.io/inject` label. This replaces
# the legacy `netbird.io/setup-key` annotation plus its NBSetupKey shim, which live on the
# deprecated NB* API.
#
# injectionMode: Container is deliberate — native sidecar injection leaves the pod stuck
# (Init / no sandbox) under kube-ovn.
---
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: kube-oidc-proxy
  namespace: kube-oidc-proxy
spec:
  name: spectrum-${NETWORK}-kube-oidc-proxy
  ephemeral: true
---
apiVersion: netbird.io/v1alpha1
kind: SidecarProfile
metadata:
  name: kube-oidc-proxy
  namespace: kube-oidc-proxy
spec:
  setupKeyRef:
    name: kube-oidc-proxy
  podSelector:
    matchLabels:
      netbird.io/inject: "true"
  injectionMode: Container
