# NetBird mesh membership for the proxy pod's injected sidecar (OIDC back-channel to
# authentik.infra).
#
# EXPERIMENT (stage only, 2026-08-23): this workload is the one moved off the deprecated NB* API to
# SidecarProfile; grafana deliberately stays on the legacy annotation path. kube-oidc-proxy fails
# LOUDLY when it cannot resolve authentik.infra (crash-loop), while grafana goes 1/1 Ready and hides
# the same failure — so the noisy one is the right probe.
#
# The blocker this is testing: the SidecarProfile injector mounts /etc/resolv.conf from an emptyDir
# into the NETBIRD container only, so netbird rewrites a private copy and the app container keeps
# cluster DNS (measured on stage: proxy resolving against 10.112.0.10 and crash-looping). Routing is
# shared — the wt0 route lives in the pod netns — only names are lost.
#
# The fix under test: pin netbird's resolver to a FIXED address instead of the peer's dynamic mesh
# IP, then point the pod at it with a plain dnsConfig. NB_DNS_RESOLVER_ADDRESS reaches the
# `--dns-resolver-address` flag because upFunc calls SetFlagsFromEnvVars(cmd) and the flag is
# registered on upCmd (verified in netbird v0.72.4, the injected image). containerOverride is applied
# as a strategic merge patch, so env merges by name and NB_SETUP_KEY et al. survive.
---
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: kube-oidc-proxy
  namespace: kube-oidc-proxy
spec:
  name: spectrum-${NETWORK}-kube-oidc-proxy
  ephemeral: true
---
apiVersion: netbird.io/v1alpha1
kind: SidecarProfile
metadata:
  name: kube-oidc-proxy
  namespace: kube-oidc-proxy
spec:
  setupKeyRef:
    name: kube-oidc-proxy
  podSelector:
    matchLabels:
      netbird.io/inject: "true"
  # Container, not the `Sidecar` default: native sidecar injection leaves the pod stuck
  # (Init / no sandbox) under kube-ovn here.
  injectionMode: Container
  containerOverride:
    env:
      - name: NB_DNS_RESOLVER_ADDRESS
        value: "127.0.0.1:53"
