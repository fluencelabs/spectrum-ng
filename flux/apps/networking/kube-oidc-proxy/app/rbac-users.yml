# Authentik group -> cluster access. Groups arrive as Impersonate-Group headers from the OIDC
# `groups` claim, prefixed with "oidc:" by the proxy (--oidc-groups-prefix). Subjects MUST carry that
# prefix.
#
# Two groups, the same on every cluster: `spectrum-admins` and `spectrum-users` (graph
# `@cloudless/fluence`, node #2554). Who is in them is decided in infra (Authentik, declarative
# people roles); what a group gets is decided here. Every cluster: spectrum-admins -> cluster-admin,
# spectrum-users -> view. A cluster that should give spectrum-users full access lists
# ../users-full-access in its clusters/<name> overlay (stage, testnet); RBAC is additive, so that
# second binding raises the group without touching this one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spectrum-kube-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: oidc:spectrum-admins
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spectrum-kube-users
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: oidc:spectrum-users
    apiGroup: rbac.authorization.k8s.io
