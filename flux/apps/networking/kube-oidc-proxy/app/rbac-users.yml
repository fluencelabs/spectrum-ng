# Authentik group -> cluster access. Groups arrive as Impersonate-Group headers from the OIDC
# `groups` claim, prefixed with "oidc:" by the proxy (--oidc-groups-prefix). Subjects MUST carry that
# prefix.
#
# Two groups, the same on every cluster: `spectrum-admins` and `spectrum-users` (graph
# `@cloudless/fluence`, node #2554). Who is in them is decided in infra (Authentik, declarative
# people roles); what a group gets is decided here, per cluster:
#   spectrum-admins -> cluster-admin everywhere;
#   spectrum-users  -> SPECTRUM_USERS_CLUSTER_ROLE, `view` unless the cluster raises it
#                      (stage/testnet set `cluster-admin` in spectrum-manual-vars; mainnet keeps `view`).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spectrum-kube-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: oidc:spectrum-admins
    apiGroup: rbac.authorization.k8s.io
---
# roleRef is immutable: changing SPECTRUM_USERS_CLUSTER_ROLE on a live cluster makes Flux fail the
# apply until this binding is deleted (Flux then recreates it with the new role).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spectrum-kube-users
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${SPECTRUM_USERS_CLUSTER_ROLE:=view}
subjects:
  - kind: Group
    name: oidc:spectrum-users
    apiGroup: rbac.authorization.k8s.io
