# Why these exist: on 2026-08-19 kube-oidc-proxy was found crash-looping for eight
# days — OIDC login to the apiserver was dead the whole time — and no alert ever
# reached anyone. KubePodCrashLooping never latched (it is `for: 15m`, and the pod
# restarted every ~4.5 min, resetting the condition to pending each time), so the
# only signals were the generic warning-level KubePodNotReady and
# KubeDeploymentReplicasMismatch. These name the capability instead of the symptom.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kube-oidc-proxy
spec:
  groups:
    - name: kube-oidc-proxy
      rules:
        # Deployment-level on purpose: pod-level crash-loop alerts flap with the
        # restart backoff and never survive their own `for:` window.
        - alert: KubeOidcProxyUnavailable
          expr: |
            kube_deployment_status_replicas_available{job="kube-state-metrics", namespace="kube-oidc-proxy", deployment="kube-oidc-proxy"} == 0
          for: 10m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: OIDC authentication to the apiserver is down.
            description: >-
              kube-oidc-proxy has had no available replica for 10 minutes, so no one
              can log in to this cluster's apiserver. If the logs show a repeating
              `lookup authentik.infra ... no such host`, the pod is missing its
              NetBird sidecar — see NetbirdSidecarMissing.
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kube-oidc-proxy-logs
  labels:
    # Evaluated by the `stack-logs` VMAlert against vlogs; the metrics instance
    # explicitly excludes this label.
    rule-type: vlogs
spec:
  groups:
    - name: kube-oidc-proxy-logs
      type: vlogs
      interval: "30s"
      rules:
        # The whole LogsQL lives in `expr`. It must NOT be split into
        # `params.query` + `expr: '* | ...'` — vmalert sends `expr` to the
        # datasource and the params filter is never applied, so `*` matches
        # EVERY log line in the cluster. Measured: all logs in 30s = 512, and the
        # rule was firing with value 551. `hits:>0` and even `hits:>5` are then
        # always true, and the alert says nothing about the proxy at all.
        - alert: KubeOidcProxyAuthenticatorFailing
          expr: '_time:5m AND namespace:kube-oidc-proxy AND container:proxy AND "oidc authenticator" | stats count(*) as hits | filter hits:>5'
          # hits:>5, not >0: a freshly rolled pod logs two or three of these in
          # the ~10s before its NetBird sidecar joins the mesh. A real failure
          # retries every ~10s, i.e. ~30 hits per window.
          # 5m, not the 0s used elsewhere: at critical severity a transient blip
          # must not page.
          for: 5m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: kube-oidc-proxy cannot initialise its OIDC plugin.
            description: >-
              {{ $value }} `oidc authenticator` errors in the last 5m. Every login
              attempt fails while this repeats. The usual cause is that the issuer
              host authentik.infra does not resolve, because the pod has no NetBird
              sidecar and so is not on the mesh.
