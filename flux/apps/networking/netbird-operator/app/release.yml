apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird-operator
spec:
  interval: 1h
  chart:
    spec:
      # 0.4.0+ renamed the chart (kubernetes-operator -> netbird-operator) and publishes it to the
      # OCI registry referenced by the `netbirdio` HelmRepository. SetupKey (v1alpha1) + legacy v1
      # CRDs (NBRoutingPeer/NBResource/NBPolicy/NBGroup/NBSetupKey) used elsewhere in this repo are
      # all still served by 0.6.0. New in 0.4.0+: an admission webhook (see values.webhook below).
      chart: netbird-operator
      version: "0.8.0"
      sourceRef:
        kind: HelmRepository
        name: netbirdio
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    managementURL: "https://netbird.infrahub.cloudless.dev"
    cluster:
      name: "spectrum-${NETWORK}-${CLUSTER_ID}"
      dns: svc.cluster.local
    netbirdAPI:
      keyFromSecret:
        name: netbird-api-token
        key: NB_API_KEY
    operator:
      # fullnameOverride moved under operator.* in the renamed chart. Keep the prior name so the
      # Deployment/Service/RBAC upgrade in place rather than getting recreated under a new name.
      fullnameOverride: netbird-operator
    webhook:
      # The chart self-provisions a selfSigned cert-manager Issuer + Certificate and wires the
      # webhook CA via cert-manager.io/inject-ca-from (cert-manager + cainjector are already
      # installed, see flux/apps/ingress/cert-manager). No issuer wiring needed from us.
      enableCertManager: true
      # failurePolicy applies to BOTH webhooks the chart renders: the mutating pod webhook and the
      # validating NBGroup-DELETE webhook. Keep it Ignore here so the NBGroup one stays non-blocking;
      # the pod webhook is flipped to Fail by the postRenderer below, where it can be paired with the
      # matchConditions that make Fail safe.
      failurePolicy: Ignore
    # netbird-services exposes mesh names two ways and BOTH need the operator's "ingress"
    # (Service-annotation) path: explicit NBResource CRs (grafana-spectrum / kube-oidc-proxy-spectrum,
    # created by Jobs) AND `netbird.io/expose` Service annotations (the `grafana` and `k8s` Services,
    # which the operator turns into NBResources + policies). 0.4.0+ made this opt-in (default off) and
    # calls it "ingress"; on 0.3.x it was always on. Keep it on, with automatic policy creation since
    # those Services declare netbird.io/policy-*. Verified on stage 2026-06-06: with enabled:false the
    # grafana/k8s NBResources are never created and their mesh endpoints break. Gateway API unused.
    ingress:
      enabled: true
      allowAutomaticPolicyCreation: true
      # The routing peer is managed by our own inline NBRoutingPeer (netbird-operator-config), so keep
      # the chart's ingress-router OFF. router.enabled must still be present: the chart template does
      # `and .Values.ingress.enabled .Values.ingress.router.enabled` and Go's `and` evaluates both
      # args, so a nil `ingress.router` nil-pointers the helm upgrade.
      router:
        enabled: false
    gatewayAPI:
      enabled: false
  # Make missed sidecar injection impossible instead of silent.
  #
  # The chart's pod webhook matches EVERY pod CREATE in the cluster, so it has to run failurePolicy:
  # Ignore — with Fail, an operator that is rolling (or whose serving cert is mid-renewal) would stop
  # the entire cluster from creating pods, including the operator itself. The cost of Ignore is that
  # a pod admitted during that window gets NO sidecar, with no error, no event and no retry, and
  # stays bare for its whole life: exactly the 2026-08-19 incident, and again on testnet 2026-08-22
  # where both kube-oidc-proxy (crash-looping on `lookup authentik.infra: no such host`) and grafana
  # (1/1 Ready, silently off the mesh) came up bare.
  #
  # matchConditions are evaluated by the API server BEFORE it dials the webhook, so they still apply
  # when the operator is down. Narrowing the webhook to just the pods that actually ask for injection
  # makes Fail safe: an unavailable operator now blocks only those pods, their ReplicaSet retries,
  # and they come up WITH the sidecar once it is back. Every other pod in the cluster is never sent
  # to the webhook at all.
  #
  # The trigger is the `netbird.io/inject` pod LABEL, which is also the podSelector on both
  # SidecarProfiles (grafana, kube-oidc-proxy). It must be kept in lockstep with them: the webhook
  # picks a profile by matching pod labels, so gating on anything the profiles do not select — or
  # selecting pods this condition does not admit — silently reopens the 2026-08-19 hole. The legacy
  # `netbird.io/setup-key` annotation is still honoured by the webhook's own code path but is no
  # longer used here; it belongs to the deprecated NB* API. The `router` pod runs netbird as its main
  # container and is not injected, so it carries neither.
  #
  # The chart exposes neither matchConditions nor a per-webhook failurePolicy (see values.webhook
  # above), hence the patch. /webhooks/0 is the only entry in this MutatingWebhookConfiguration.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: admissionregistration.k8s.io
              version: v1
              kind: MutatingWebhookConfiguration
              name: netbird-operator-mpod-webhook
            patch: |
              - op: replace
                path: /webhooks/0/failurePolicy
                value: Fail
              - op: add
                path: /webhooks/0/matchConditions
                value:
                  - name: has-netbird-inject-label
                    expression: >-
                      has(object.metadata.labels) &&
                      'netbird.io/inject' in object.metadata.labels
