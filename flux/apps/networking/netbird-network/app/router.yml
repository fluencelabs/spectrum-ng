# Routing peer and NetBird Network of this cluster. The operator names the NetBird Network after
# metadata.name, so the name carries the cluster (sp-<network>-<first 8 of CLUSTER_ID>, the prefix
# netbird-setup already uses). Keep it short: the operator derives a Service
# networkrouter-<name>-forwarder from it, and a Service name is capped at 63 characters.
# dnsZoneRef.name is matched against the zone's name in NetBird; the zone is created by infra.
apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: sp-${NETWORK}-${CLUSTER_ID:0:8}
  namespace: networking
spec:
  dnsZoneRef:
    name: ${CLUSTER_ID}.${NETWORK}.spectrum
  # Not the routingClientImage pin (0.80.0) from the operator HelmRelease: the operator starts this
  # client with NB_DISABLE_UPDATE_SETTINGS=true, and 0.80.0 then fails to log in ("update settings
  # are disabled", stage 2026-10-08). 0.72.4 is the client operator v0.8.0 is built against.
  image: ghcr.io/netbirdio/netbird:0.80.0
  workloadOverride:
    replicas: 1
