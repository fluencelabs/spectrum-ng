# Mesh exposure through the operator's v1alpha1 Network API (NetworkRouter + NetworkResource), which
# also writes A records into the cluster's NetBird DNS zone <CLUSTER_ID>.<NETWORK>.spectrum.
# The zone and the per-network access policy are owned by infra (crossplane); a new cluster's
# NetworkRouter stays not ready until infra has created its zone.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-network
  namespace: flux-system
spec:
  path: ./flux/apps/networking/netbird-network/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spectrum-vars
        optional: false
      - kind: ConfigMap
        name: spectrum-manual-vars
        optional: true
  dependsOn:
    # CRDs and the controllers.
    - name: netbird-operator
    # Namespaces and the ClusterIP Services the NetworkResources point at.
    - name: grafana
    - name: kube-oidc-proxy
    - name: crd-operator
    # Gateway API and Envoy Gateway CRDs for the crd-api mesh gateway.
    - name: envoy
