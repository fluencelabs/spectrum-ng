# Mesh exposure through the operator's v1alpha1 Network API (NetworkRouter + NetworkResource), which
# also writes A records into the cluster's NetBird DNS zone <CLUSTER_ID>.<NETWORK>.spectrum.
# Included per cluster from clusters/<cluster>/kustomization.yml, not from the networking
# aggregator: the zone and the per-network access policy are owned by infra (crossplane), and the
# NetworkRouter never becomes ready until its zone exists. Add a cluster here only after infra has
# created both for it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-network
  namespace: flux-system
spec:
  path: ./flux/apps/networking/netbird-network/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spectrum-vars
        optional: false
      - kind: ConfigMap
        name: spectrum-manual-vars
        optional: true
  dependsOn:
    # CRDs and the controllers.
    - name: netbird-operator
    # Namespaces and the ClusterIP Services the NetworkResources point at.
    - name: grafana
    - name: kube-oidc-proxy
