# CDI's importer pods fetch every HTTP(S) import, redirects included, through
# this proxy once the CDI resource points at it (flux/apps/kubevirt/kubevirt-cdi),
# and it refuses any destination whose resolved address is internal. Built
# in (smokescreen v0.1.0 classifyAddr, on every network): 10/8, 172.16/12,
# 192.168/16, fc00::/7 (private), 100.64/10 (CGNAT), 127/8 and ::1,
# 169.254/16 and fe80::/10, multicast, 0.0.0.0 and broadcast (not global
# unicast), IPv4-embedding IPv6, and its own interfaces. Added below with
# --deny-range (appended to the config's list, not replacing it): 0/8 and
# 240/4, which Go counts as global unicast. Each network's
# `deny-ranges.yaml` adds only public addresses (node ExternalIPs); the init
# container joins it to the shared `config.yaml`. No hostname ACL: every
# hostname is allowed and the dialled address decides. Unlike the workspace egress
# NetworkPolicy it closes the importer's own node too, and it does not
# depend on when Kube-OVN programs a new pod's ACLs.
#
# Workspace importers reach these pods through the AdminNetworkPolicy in
# ../../admin-policy (namespace `fluence`, pod label
# `app.kubernetes.io/name=smokescreen`, port 4750); keep the three in step.
#
# No image is built for it: an init container fetches upstream's release
# binary, checks it against the sha256 below and puts it in an emptyDir, and
# the proxy runs it from distroless. The download needs github.com and its
# release-asset CDN on 443: nothing limits this pod's egress (the
# NetworkPolicy below is ingress-only, and no egress policy selects the
# `fluence` namespace), and the proxy needs the open internet anyway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smokescreen
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: smokescreen
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch
          image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          imagePullPolicy: IfNotPresent
          env:
            # A bump changes the version AND both sha256s: take each from the
            # asset itself (download, sha256sum) and cross-check upstream's
            # SHA256SUMS. Nothing reads SHA256SUMS at run time.
            - name: SMOKESCREEN_VERSION
              value: v0.1.0
            - name: SHA256_LINUX_AMD64
              value: 4e1e447449e3cc653dae956208588722b5c8fe8ce894f633adc756a851d1ec46
            - name: SHA256_LINUX_ARM64
              value: f15ddd0dc2b2cbc6d7318f441928939eb9bedfab2a1881508af3096a1e24b7c9
          command:
            - /bin/sh
            - -euc
            - |
              case "$(uname -m)" in
                x86_64) arch=amd64; sum="$SHA256_LINUX_AMD64" ;;
                aarch64) arch=arm64; sum="$SHA256_LINUX_ARM64" ;;
                *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
              esac
              name="smokescreen_${SMOKESCREEN_VERSION}_linux_${arch}"
              asset=/opt/smokescreen/asset.tar.gz
              curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 \
                --retry 5 --retry-all-errors --max-time 300 -o "$asset" \
                "https://github.com/stripe/smokescreen/releases/download/${SMOKESCREEN_VERSION}/${name}.tar.gz"
              echo "${sum}  ${asset}" | sha256sum -c -
              tar -xzOf "$asset" "${name}/smokescreen" > /opt/smokescreen/smokescreen
              rm "$asset"
              chmod 0555 /opt/smokescreen/smokescreen
              # One config file: the shared settings, then this network's
              # deny list (two YAML mappings with no key in common).
              cat /etc/smokescreen/shared/config.yaml \
                /etc/smokescreen/network/deny-ranges.yaml \
                > /opt/smokescreen/config.yaml
          volumeMounts:
            - name: bin
              mountPath: /opt/smokescreen
            - name: config
              mountPath: /etc/smokescreen/shared
              readOnly: true
            - name: deny-ranges
              mountPath: /etc/smokescreen/network
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: smokescreen
          # distroless static, nonroot (uid 65532): the binary is static Go.
          image: gcr.io/distroless/static:nonroot@sha256:516757106de35205efb70b91ba03f6f1298424a0678c603255cf2852a7000087
          imagePullPolicy: IfNotPresent
          command:
            - /opt/smokescreen/smokescreen
          args:
            - --config-file=/opt/smokescreen/config.yaml
            # The two special ranges the built-ins miss (header comment).
            - --deny-range=0.0.0.0/8
            - --deny-range=240.0.0.0/4
          ports:
            - name: proxy
              containerPort: 4750
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: proxy
          livenessProbe:
            tcpSocket:
              port: proxy
          volumeMounts:
            - name: bin
              mountPath: /opt/smokescreen
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          # Not measured yet: a Go proxy copying streams.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: bin
          emptyDir:
            sizeLimit: 64Mi
        - name: config
          configMap:
            name: smokescreen-config
        # Generated by each network's overlay.
        - name: deny-ranges
          configMap:
            name: smokescreen-deny-ranges
