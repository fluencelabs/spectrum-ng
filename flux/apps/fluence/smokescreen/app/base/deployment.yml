# CDI's importer pods fetch every HTTP(S) import, redirects included, through
# this proxy once the CDI resource points at it (flux/apps/kubevirt/kubevirt-cdi),
# and it refuses any destination whose resolved address is internal. No
# hostname ACL: every hostname is allowed and the dialled address decides.
# Unlike the workspace egress NetworkPolicy it closes the importer's own node
# too, and it does not depend on when Kube-OVN programs a new pod's ACLs.
#
# Workspace importers reach these pods through the AdminNetworkPolicy in
# ../../admin-policy (namespace `fluence`, pod label
# `app.kubernetes.io/name=smokescreen`, port 4750); keep the three in step.
#
# No image is built for it: an init container fetches upstream's release
# binary, checks it against the sha256 below and puts it in an emptyDir, and
# the proxy runs it from distroless. The download needs github.com and its
# release-asset CDN on 443: nothing limits this pod's egress (the
# NetworkPolicy below is ingress-only, and no egress policy selects the
# `fluence` namespace), and the proxy needs the open internet anyway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smokescreen
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: smokescreen
  template:
    metadata:
      annotations:
        cloudless.dev/deny-ranges: "[0.0.0.0/8, 240.0.0.0/4${NODE_PUBLIC_CIDRS:=}]"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch
          image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          imagePullPolicy: IfNotPresent
          env:
            # A bump changes the version AND both sha256s: take each from the
            # asset itself (download, sha256sum) and cross-check upstream's
            # SHA256SUMS. Nothing reads SHA256SUMS at run time.
            - name: SMOKESCREEN_VERSION
              value: v0.1.0
            - name: SHA256_LINUX_AMD64
              value: 4e1e447449e3cc653dae956208588722b5c8fe8ce894f633adc756a851d1ec46
            - name: SHA256_LINUX_ARM64
              value: f15ddd0dc2b2cbc6d7318f441928939eb9bedfab2a1881508af3096a1e24b7c9
          command:
            - /bin/sh
            - -euc
            - |
              case "$(uname -m)" in
                x86_64) arch=amd64; sum="$SHA256_LINUX_AMD64" ;;
                aarch64) arch=arm64; sum="$SHA256_LINUX_ARM64" ;;
                *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
              esac
              name="smokescreen_$${SMOKESCREEN_VERSION}_linux_$${arch}"
              asset=/opt/smokescreen/asset.tar.gz
              curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 \
                --retry 5 --retry-all-errors --max-time 300 -o "$asset" \
                "https://github.com/stripe/smokescreen/releases/download/$${SMOKESCREEN_VERSION}/$${name}.tar.gz"
              echo "$${sum}  $${asset}" | sha256sum -c -
              tar -xzOf "$asset" "$${name}/smokescreen" > /opt/smokescreen/smokescreen
              rm "$asset"
              chmod 0555 /opt/smokescreen/smokescreen
          volumeMounts:
            - name: bin
              mountPath: /opt/smokescreen
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: smokescreen
          # distroless static, nonroot (uid 65532): the binary is static Go.
          image: gcr.io/distroless/static:nonroot@sha256:18f4cc26c9ffa7f20a359298be7deadac5c607c8e03a02b8119f1a5fc2f82c99
          imagePullPolicy: IfNotPresent
          command:
            - /opt/smokescreen/smokescreen
          args:
            - --config-file=/etc/smokescreen/config.yaml
          ports:
            - name: proxy
              containerPort: 4750
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: proxy
          livenessProbe:
            tcpSocket:
              port: proxy
          volumeMounts:
            - name: bin
              mountPath: /opt/smokescreen
              readOnly: true
            - name: config
              mountPath: /etc/smokescreen
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          # Not measured yet: a Go proxy copying streams.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: bin
          emptyDir:
            sizeLimit: 64Mi
        - name: config
          configMap:
            name: smokescreen-config
