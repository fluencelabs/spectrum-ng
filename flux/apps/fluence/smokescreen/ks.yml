# Egress proxy for CDI's importer pods (stripe/smokescreen), on every cluster
# that runs fluence; app/overlays/<NETWORK> holds only that network's deny list.
# Order: network-policy-api CRDs -> smokescreen-admin-policy (the ANP) ->
# smokescreen -> kubevirt-cdi (the CDI resource that points importers here).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smokescreen
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./flux/apps/fluence/smokescreen/app/overlays/${NETWORK}
  prune: true
  targetNamespace: fluence
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  # Workspace importers reach the proxy only through the AdminNetworkPolicy.
  dependsOn:
    - name: smokescreen-admin-policy
  # Ready only once the Deployment is: kubevirt-cdi waits on this.
  wait: true
  timeout: 5m
---
# The cluster-scoped AdminNetworkPolicy that lets workspace importers reach the
# proxy (admin-policy/adminnetworkpolicy.yml). Its own Kustomization: no
# targetNamespace for a cluster-scoped object, and it needs the
# network-policy-api CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smokescreen-admin-policy
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./flux/apps/fluence/smokescreen/admin-policy
  prune: true
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  dependsOn:
    - name: network-policy-api-crds
  wait: true
  timeout: 5m
