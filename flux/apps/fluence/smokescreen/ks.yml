# Egress proxy for CDI's importer pods (stripe/smokescreen), on every cluster
# that runs fluence.
# Order: smokescreen -> smokescreen-admin-policy (the ANP, after the
# network-policy-api CRDs) -> kubevirt-cdi (the CDI resource that points
# importers here) -> smokescreen-images-policy (golden Image importers may
# reach nothing but the proxy and DNS).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smokescreen
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./flux/apps/fluence/smokescreen/app/base
  prune: true
  targetNamespace: fluence
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spectrum-manual-vars
        optional: true
  # Ready only once the Deployment is: the AdminNetworkPolicy waits on this.
  wait: true
  timeout: 5m
---
# The cluster-scoped AdminNetworkPolicy that lets workspace importers reach the
# proxy (admin-policy/adminnetworkpolicy.yml). Its own Kustomization: no
# targetNamespace for a cluster-scoped object, and it needs the
# network-policy-api CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smokescreen-admin-policy
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./flux/apps/fluence/smokescreen/admin-policy
  prune: true
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  # After the proxy is up: Kube-OVN (1.16) writes an ANP rule's ACL only when
  # the ANP is added and its peer pods already have addresses; peers that
  # appear later fill the address set but never create the ACL.
  dependsOn:
    - name: network-policy-api-crds
    - name: smokescreen
  wait: true
  timeout: 5m
---
# Golden Image importers in `cloudless-images` (images-policy/): a
# NetworkPolicy that leaves them only DNS and the proxy, and an
# AdminNetworkPolicy that denies them everything off the pod network, their own
# node included. No targetNamespace (the ANP is cluster-scoped; the
# NetworkPolicy names its namespace).
#
# After kubevirt-cdi, so importers carry the proxy env before their direct
# path closes (an importer keeps the env it was created with), and after
# crd-operator, whose chart creates `cloudless-images`. crd-operator is Ready
# once its HelmRelease is applied, not installed: on a new cluster the first
# applies may fail on the missing namespace and are retried every interval.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smokescreen-images-policy
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./flux/apps/fluence/smokescreen/images-policy
  prune: true
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  dependsOn:
    - name: network-policy-api-crds
    - name: crd-operator
    - name: kubevirt-cdi
  # POD_CIDR, the pod network the ANP passes (defaults to kube-ovn's
  # 10.16.0.0/16 when unset).
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spectrum-manual-vars
        optional: true
  wait: true
  timeout: 5m
