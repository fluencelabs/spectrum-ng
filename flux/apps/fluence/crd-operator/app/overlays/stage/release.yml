apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crd-operator
spec:
  chart:
    spec:
      chart: ./charts/crd-operator
      sourceRef:
        kind: GitRepository
        name: lightmare
        namespace: fluence
      interval: 1m
      reconcileStrategy: Revision
  values:
    controller:
      persistence:
        storageClassName: lvm-thin-r1
      # The chart's built-in denyCidrs default covers every private and special
      # range (10/8, 100.64/10, 172.16/12, 192.168/16, 169.254/16, 127/8, 0/8,
      # 224/4, 240/4); extraDenyCidrs appends what lies outside them: the nodes'
      # public addresses (every ExternalIP, a public underlay the nodes sit in).
      # Kept identical to smokescreen's deny list for stage
      # (flux/apps/fluence/smokescreen/app/overlays/stage/deny-ranges.yaml).
      #
      # TODO: empty until the ExternalIPs are read live from the cluster
      # (kubectl get nodes -o wide). Needs a chart that knows extraDenyCidrs.
      workspaceEgress:
        extraDenyCidrs: []

    vmApi:
      jwt:
        jwksUrl: "https://api.stage.fluence.dev/v1/internal/.well_known/jwks.json"
