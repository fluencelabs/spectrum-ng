apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crd-operator
spec:
  chart:
    spec:
      chart: ./charts/crd-operator
      sourceRef:
        kind: GitRepository
        name: lightmare
        namespace: fluence
      interval: 1m
      reconcileStrategy: Revision
  values:
    controller:
      persistence:
        storageClassName: lvm-thin-r1

    admission:
      networkPolicy:
        enabled: true
        webhookFrom:
          - ipBlock:
              cidr: 10.103.0.127/32
        metricsFrom:
          - ipBlock:
              cidr: 10.103.0.127/32
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability

    vmApi:
      jwt:
        jwksUrl: "https://api.stage.fluence.dev/v1/internal/.well_known/jwks.json"
