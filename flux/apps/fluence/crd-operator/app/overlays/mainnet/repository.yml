apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: crd-operator
spec:
  interval: 5m0s
  url: oci://containers.cloudless.dev/release/crd-operator-chart
  # Private registry (zot): the chart lives next to the four images and needs
  # the same node-puller credentials. The secret is hand-seeded per cluster
  # (docs/adding-a-cluster.md) and NOT managed by Flux.
  secretRef:
    name: fluence-regcred
  ref:
    tag: 0.3.0
