apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crd-operator
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: crd-operator
    namespace: fluence
  values:
    controller:
      image:
        repository: "containers.cloudless.dev/release/crd-controller"
        tag: "0.9.2"
      persistence:
        storageClassName: lvm-thin-r2
      # Internal ranges workspace pods may not reach (the chart refuses to
      # render while the policy is enabled and this is empty). This overlay
      # serves two clusters, poz-bey-c01 and fra-flix-01, so the list is the
      # union of both. NOT read live from either cluster; check before the
      # chart pin moves. Kept identical to the smokescreen mainnet deny list
      # (flux/apps/fluence/smokescreen/app/overlays/mainnet). Missing: the
      # nodes' ExternalIPs and both storage networks (STORAGE_CIDR lives in
      # each cluster's spectrum-manual-vars). No IPv6 entry: a family with no
      # CIDR gets no outside access.
      workspaceEgress:
        denyCidrs:
          - 10.16.0.0/16    # Kube-OVN ovn-default (pod network): chart default, assumed
          - 100.64.0.0/16   # Kube-OVN join subnet: chart default, assumed
          - 10.112.0.0/12   # poz-bey-c01 service CIDR (kube-dns 10.112.0.10)
          - 10.208.0.0/12   # fra-flix-01 service CIDR: inferred from kube-dns 10.208.0.10
          - 10.103.0.19/32  # poz-bey-c01 node InternalIPs
          - 10.103.0.20/32
          - 10.103.0.21/32
          - 10.113.0.1/32   # fra-flix-01 node InternalIPs
          - 10.113.0.2/32
          - 10.113.0.3/32
          - 169.254.0.0/16  # link-local / metadata

    api:
      image:
        repository: "containers.cloudless.dev/release/crd-api"
        tag: "0.12.0"

    admission:
      image:
        repository: "containers.cloudless.dev/release/crd-admission"
        tag: "0.5.3"

    vmApi:
      image:
        repository: "containers.cloudless.dev/release/crd-vm-api"
        tag: "0.3.7"
      jwt:
        jwksUrl: "https://api.fluence.dev/v1/internal/.well_known/jwks.json"
