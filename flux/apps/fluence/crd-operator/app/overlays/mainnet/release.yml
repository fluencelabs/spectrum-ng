apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crd-operator
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: crd-operator
    namespace: fluence
  values:
    controller:
      image:
        repository: "containers.cloudless.dev/release/crd-controller"
        tag: "0.9.2"
      persistence:
        storageClassName: lvm-thin-r2
      # The chart's built-in denyCidrs default covers every private and special
      # range (10/8, 100.64/10, 172.16/12, 192.168/16, 169.254/16, 127/8, 0/8,
      # 224/4, 240/4); extraDenyCidrs appends what lies outside them: the nodes'
      # public addresses (every ExternalIP, a public underlay the nodes sit in).
      # One overlay serves two clusters, poz-bey-c01 and fra-flix-01: list the
      # public addresses of both.
      # Kept identical to smokescreen's deny list for mainnet
      # (flux/apps/fluence/smokescreen/app/overlays/mainnet/deny-ranges.yaml).
      #
      # TODO: empty until the ExternalIPs are read live from the cluster
      # (kubectl get nodes -o wide). Needs a chart that knows extraDenyCidrs.
      workspaceEgress:
        extraDenyCidrs: []

    api:
      image:
        repository: "containers.cloudless.dev/release/crd-api"
        tag: "0.12.0"

    admission:
      image:
        repository: "containers.cloudless.dev/release/crd-admission"
        tag: "0.5.3"

    vmApi:
      image:
        repository: "containers.cloudless.dev/release/crd-vm-api"
        tag: "0.3.7"
      jwt:
        jwksUrl: "https://api.fluence.dev/v1/internal/.well_known/jwks.json"
