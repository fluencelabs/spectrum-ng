apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crd-operator
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: crd-operator
    namespace: fluence
  values:
    controller:
      image:
        repository: "containers.cloudless.dev/release/crd-controller"
        tag: "0.11.0"
      persistence:
        storageClassName: lvm-thin-r2

    api:
      image:
        repository: "containers.cloudless.dev/release/crd-api"
        tag: "0.14.0"

    admission:
      image:
        repository: "containers.cloudless.dev/release/crd-admission"
        tag: "0.7.0"
      # Source of the kube-apiserver's webhook calls, observed via
      # crd_admission_webhook_callers_total on 2026-11-02 on both admission
      # pods, incl. the one on a node without a kube-apiserver: kabat-02's
      # InternalIP, testnet's only control-plane node. The webhooks are
      # failurePolicy Fail: a new or re-addressed control-plane node must be
      # added here BEFORE it serves the apiserver, or every routed write is
      # refused. metricsFrom keeps the apiserver proxy to /metrics working;
      # its observability peer lets vmagent scrape /metrics.
      networkPolicy:
        enabled: true
        webhookFrom:
          - ipBlock:
              cidr: 10.103.0.130/32
        metricsFrom:
          - ipBlock:
              cidr: 10.103.0.130/32
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability

    vmApi:
      image:
        repository: "containers.cloudless.dev/release/crd-vm-api"
        tag: "0.3.9"
      jwt:
        jwksUrl: "https://api.testnet.fluence.dev/v1/internal/.well_known/jwks.json"
