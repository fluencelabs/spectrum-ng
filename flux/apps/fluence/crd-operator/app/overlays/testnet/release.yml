apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crd-operator
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: crd-operator
    namespace: fluence
  values:
    controller:
      image:
        repository: "containers.cloudless.dev/release/crd-controller"
        tag: "0.9.2"
      persistence:
        storageClassName: lvm-thin-r2
      # denyCidrs for testnet comes with the change setting the testnet
      # workspace egress deny list; this needs it (the chart refuses an
      # enabled policy with an empty list).
      workspaceEgress:
        # Lets workspace importers reach the smokescreen proxy
        # (flux/apps/fluence/smokescreen): its pods sit in the pod network,
        # which denyCidrs closes. Needs a chart and controller that know
        # `importProxy` (an older chart ignores it); must be live before the
        # CDI resource points importers at the proxy.
        importProxy:
          enabled: true
          namespace: fluence
          podLabel: app.kubernetes.io/name=smokescreen
          port: 4750

    api:
      image:
        repository: "containers.cloudless.dev/release/crd-api"
        tag: "0.12.0"

    admission:
      image:
        repository: "containers.cloudless.dev/release/crd-admission"
        tag: "0.5.3"

    vmApi:
      image:
        repository: "containers.cloudless.dev/release/crd-vm-api"
        tag: "0.3.7"
      jwt:
        jwksUrl: "https://api.testnet.fluence.dev/v1/internal/.well_known/jwks.json"
