apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crd-operator
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: crd-operator
    namespace: fluence
  values:
    controller:
      image:
        repository: "containers.cloudless.dev/release/crd-controller"
        tag: "0.9.2"
      persistence:
        storageClassName: lvm-thin-r2
      # Internal ranges workspace pods may not reach (the chart refuses to
      # render while the policy is enabled and this is empty). NOT read live:
      # the kabat (testnet) apiserver was unreachable through beam-agent, so
      # these come from this repo and recorded observations of the cluster;
      # check them against the cluster before the chart pin moves. CoreDNS sits
      # in ovn-default and is allowed by its own rule. No IPv6 entry: kube-ovn
      # runs IPv4-only here, and a family with no CIDR gets no outside access.
      workspaceEgress:
        denyCidrs:
          - 10.16.0.0/16    # Kube-OVN ovn-default subnet (the pod network)
          - 10.112.0.0/12   # service CIDR (kube-dns at 10.112.0.10)
          - 10.118.147.0/24 # LINSTOR storage network (STORAGE_CIDR), inside the service CIDR
          - 100.64.0.0/16   # Kube-OVN join subnet; Talos siderolink addresses land here too
          - 100.65.0.0/24   # Kube-OVN egress-fabric subnet, if the cluster has one
          - 10.244.0.0/16   # Talos default podSubnets (node spec.podCIDRs, unused by Kube-OVN)
          - 10.103.0.0/16   # node network: kabat-02 10.103.0.130, kabat-03 10.103.0.128; prefix assumed
          - 169.254.0.0/16  # link-local / metadata

    api:
      image:
        repository: "containers.cloudless.dev/release/crd-api"
        tag: "0.12.0"

    admission:
      image:
        repository: "containers.cloudless.dev/release/crd-admission"
        tag: "0.5.3"

    vmApi:
      image:
        repository: "containers.cloudless.dev/release/crd-vm-api"
        tag: "0.3.7"
      jwt:
        jwksUrl: "https://api.testnet.fluence.dev/v1/internal/.well_known/jwks.json"
