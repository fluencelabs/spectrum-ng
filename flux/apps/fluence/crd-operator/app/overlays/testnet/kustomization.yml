apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - repository.yml
patches:
  - path: release.yml
# The workspace egress deny list is the base's default (every private and
# special range); a network appends only its public addresses — every node
# ExternalIP, a public underlay the nodes sit in — one JSON6902 `add` per
# CIDR, so the default is never replaced. The same addresses as smokescreen's
# deny list for testnet
# (flux/apps/fluence/smokescreen/app/overlays/testnet/deny-ranges.yaml).
