apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crd-operator
spec:
  interval: 5m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    crds: Create
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    # Without this the cluster has NO automatic path for CRD changes at all.
    # The CRDs ship in `charts/crd-operator/crds/`, and Helm never upgrades that
    # directory; Flux's default is `crds: Create`, which creates them once and
    # then leaves them untouched forever. So a chart release carrying a new CRD
    # field installs the new controller against the old schema — the apiserver
    # silently prunes the unknown fields, and the feature behaves as if it were
    # switched off. Lightmare's documented remedy is a hand-run
    # `crd-gen | kubectl apply` before the image bump, i.e. a step that lives in
    # a PR description and is guaranteed by nothing.
    #
    # `CreateReplace` replaces the CRDs on every chart upgrade. That is the
    # point, and it is also the cost: a chart rollback carries the schema back
    # with it. It cannot drop data on its own (a replace preserves stored
    # objects), but a field removed from the schema stops being served, so
    # sequence a rollback the same way as a rollout — schema and image together.
    crds: CreateReplace
  driftDetection:
    mode: enabled
  values:
    controller:
      config:
        LTM__LOG_FORMAT: json
        LTM_CRD_CTRL__PUBLIC_NETWORK__ENABLED: "true"
        LTM_CRD_CTRL__PUBLIC_NETWORK__NAD_NAME: public
        LTM_CRD_CTRL__PUBLIC_NETWORK__SUBNETS: ${PUBLIC_SUBNET_LIST}
        # Egress, per-cluster via spectrum-manual-vars. The ENABLED gate
        # defaults to false so a cluster that sets nothing keeps egress off;
        # FABRIC_SUBNET and HUB_NEXT_HOP carry no default on purpose — with
        # egress switched on, a missing value must fail the substitution loudly
        # rather than silently wire the fabric somewhere unintended.
        # (EXTERNAL_NETWORK__ENABLED is gone since crd-controller 0.9.0: the
        # egress reconcile is the single owner of the VPC's `enableExternal`.)
        LTM_CRD_CTRL__EGRESS__ENABLED: "${EGRESS_ENABLED:=false}"
        LTM_CRD_CTRL__EGRESS__FABRIC_SUBNET: "${EGRESS_FABRIC_SUBNET}"
        LTM_CRD_CTRL__EGRESS__HUB_NEXT_HOP: "${EGRESS_HUB_NEXT_HOP}"
        # Whether this cluster defines a DEFAULT external network
        # (`ovn-external-gw-config` in kube-system). None of our clusters does,
        # hence false. A wrong "false" LATCHES per VPC in the annotation
        # `egress.cloudless.dev/owns-external` once the first egress pass has
        # run, and the next teardown then disconnects the default gateway —
        # so set it to "true" BEFORE enabling egress on a cluster that has one.
        LTM_CRD_CTRL__EGRESS__CLUSTER_DEFAULT_EXTERNAL_NETWORK: "${EGRESS_CLUSTER_DEFAULT_EXTERNAL_NETWORK:=false}"
        LTM_CRD_CTRL__VM_RUNTIME__DEFAULT_DNS_CONFIG__NAMESERVERS: '["1.1.1.1" ,"8.8.8.8"]'
        LTM_CRD_CTRL__VM_RUNTIME__DEFAULT_DNS_CONFIG__SEARCHES: '[]'
      persistence:
        enabled: true
        accessModes:
          - ReadWriteOnce
        size: 1Gi

    api:
      config:
        LTM__LOG_FORMAT: json
        LTM_CRD_API__STORAGE__NVME: "lvm-thin-r1"
        LTM_CRD_API__STORAGE__REPLICATED_NVME: "lvm-thin-r2"

    admission:
      config:
        LTM__LOG_FORMAT: json

    vmApi:
      config:
        LTM__LOG_FORMAT: json
      jwt:
        # vodopad signs vm-access JWTs with `iss: "vodopad"`; vm-api validates
        # `iss` against this exact string. Same in every env (the per-env
        # bit lives in jwksUrl, which points at each env's vodopad JWKS).
        issuer: "vodopad"
