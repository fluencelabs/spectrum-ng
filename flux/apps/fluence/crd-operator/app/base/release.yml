apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crd-operator
spec:
  interval: 5m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  driftDetection:
    mode: enabled
  values:
    controller:
      config:
        LTM__LOG_FORMAT: json
        LTM_CRD_CTRL__PUBLIC_NETWORK__ENABLED: "true"
        LTM_CRD_CTRL__PUBLIC_NETWORK__NAD_NAME: public
        LTM_CRD_CTRL__PUBLIC_NETWORK__SUBNETS: ${PUBLIC_SUBNET_LIST}
        # Egress (per-cluster via spectrum-vars; default OFF so other clusters
        # keep egress disabled — Feature ENABLED=false wins regardless of fields).
        LTM_CRD_CTRL__EXTERNAL_NETWORK__ENABLED: "${EXTERNAL_NETWORK_ENABLED:=false}"
        LTM_CRD_CTRL__EGRESS__ENABLED: "${EGRESS_ENABLED:=false}"
        LTM_CRD_CTRL__EGRESS__EXTERNAL_SUBNET: "${EGRESS_EXTERNAL_SUBNET:=external}"
        LTM_CRD_CTRL__EGRESS__GATEWAY_NAMESPACE: "${EGRESS_GW_NAMESPACE:=networking}"
        LTM_CRD_CTRL__EGRESS__REPLICAS: "${EGRESS_REPLICAS:=1}"
        LTM_CRD_CTRL__EGRESS__FABRIC_SUBNET: "${EGRESS_FABRIC_SUBNET}"
        LTM_CRD_CTRL__EGRESS__HUB_NEXT_HOP: "${EGRESS_HUB_NEXT_HOP}"
        LTM_CRD_CTRL__VM_RUNTIME__DEFAULT_DNS_CONFIG__NAMESERVERS: '["1.1.1.1" ,"8.8.8.8"]'
        LTM_CRD_CTRL__VM_RUNTIME__DEFAULT_DNS_CONFIG__SEARCHES: '[]'
      persistence:
        enabled: true
        accessModes:
          - ReadWriteOnce
        size: 1Gi

    api:
      config:
        LTM__LOG_FORMAT: json
        LTM_CRD_API__STORAGE__NVME: "lvm-thin-r1"
        LTM_CRD_API__STORAGE__REPLICATED_NVME: "lvm-thin-r2"

    admission:
      config:
        LTM__LOG_FORMAT: json

    vmApi:
      config:
        LTM__LOG_FORMAT: json
      jwt:
        # vodopad signs vm-access JWTs with `iss: "vodopad"`; vm-api validates
        # `iss` against this exact string. Same in every env (the per-env
        # bit lives in jwksUrl, which points at each env's vodopad JWKS).
        issuer: "vodopad"
