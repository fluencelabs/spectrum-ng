apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-cloudflare
spec:
  interval: 5m
  chart:
    spec:
      chart: external-dns
      version: 1.19.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 5m
  values:
    sources:
      - gateway-httproute
    policy: sync
    txtOwnerId: "K8S-${NETWORK}-${PROVIDER}"
    domainFilters:
      - "cloudless.dev"
    provider: cloudflare
    extraArgs:
      - --exclude-record-types=AAAA
    serviceMonitor:
      enabled: true
    # Sized from 14 days of cadvisor data on spectrum stage: memory peaked at
    # ~16Mi, CPU at ~0.3m. The footprint tracks the number of managed records,
    # so the memory limit keeps a wide margin. No CPU limit, to avoid throttling
    # a process that is idle between reconcile intervals.
    resources:
      requests:
        cpu: 10m
        memory: 32M
      limits:
        memory: 128M
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-external-dns-token
            key: token
