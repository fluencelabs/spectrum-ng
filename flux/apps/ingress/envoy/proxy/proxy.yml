apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: eg-public-ovn
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        annotations:
          ovn.kubernetes.io/attachmentprovider: public.kube-system.ovn
          public.kube-system.ovn.kubernetes.io/logical_switch: ${ENVOY_PUBLIC_SUBNET}
          ovn.kubernetes.io/service_external_ip_from_subnet: ${ENVOY_PUBLIC_SUBNET}
          ovn.kubernetes.io/vpc: ovn-cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              type: LoadBalancer
              allocateLoadBalancerNodePorts: false
              externalTrafficPolicy: Cluster
              # Pin the external address instead of taking whatever IPAM hands out.
              # kube-ovn copies spec.loadBalancerIP onto the lb-svc pod as the
              # <provider>.kubernetes.io/ip_address annotation (pkg/controller/service_lb.go),
              # so the pod reclaims the same address on every recreation.
              #
              # Without this the address drifts: when the lb-svc pod is recreated, the
              # previous pod's IP record is not released in time, so IPAM hands out the
              # next free address while the Service still advertises the old one — and
              # traffic arrives at an address nobody holds.
              #
              # Reserve the same address in the subnet's excludeIps so tenant VMs and
              # lightmare cannot take it (lightmare derives its pool from the subnet's
              # status.v4AvailableIPRange, which kube-ovn computes with excludeIps applied).
              # Order matters: pin first, exclude second — otherwise the lb-svc pod has
              # nowhere to take its own address from.
              loadBalancerIP: ${ENVOY_PUBLIC_IP:=}
              ports:
                - name: http-10080
                  port: 10080
                  protocol: TCP
                  targetPort: 10080
                - name: https-10443
                  port: 10443
                  protocol: TCP
                  targetPort: 10443
