apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: eg-public-ovn
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        annotations:
          ovn.kubernetes.io/attachmentprovider: public.kube-system.ovn
          public.kube-system.ovn.kubernetes.io/logical_switch: ${ENVOY_PUBLIC_SUBNET}
          ovn.kubernetes.io/service_external_ip_from_subnet: ${ENVOY_PUBLIC_SUBNET}
          ovn.kubernetes.io/vpc: ovn-cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              type: LoadBalancer
              allocateLoadBalancerNodePorts: false
              externalTrafficPolicy: Cluster
              # Pin the external address instead of taking whatever IPAM hands out.
              # kube-ovn reads spec.loadBalancerIP and writes it into the lb-svc pod
              # TEMPLATE as the <provider>.kubernetes.io/ip_address annotation
              # (pkg/controller/service_lb.go). Setting that annotation on the Service
              # itself does nothing — only logical_switch is copied from there.
              #
              # Note: the template is filled when kube-ovn creates the lb-svc Deployment.
              # Adding the pin to an existing deployment therefore requires deleting that
              # Deployment so kube-ovn recreates it; deleting only the pod is not enough,
              # the template stays as it was.
              #
              # Without pinning the address drifts: when the lb-svc pod is recreated the
              # previous pod's IP record is not released in time, so IPAM hands out the
              # next free address while the Service still advertises the old one — and
              # traffic arrives at an address nobody holds.
              #
              # No excludeIps entry is needed for this address: kube-ovn already keeps
              # allocated addresses out of the subnet's status.v4AvailableIPRange, and
              # that range is exactly what lightmare allocates tenant public IPs from.
              # Excluding a pinned address is in fact harmful — the lb-svc pod may then
              # fail to reclaim its own address on recreation. excludeIps is only for
              # reserving an address ahead of time, before anything holds it.
              loadBalancerIP: ${ENVOY_PUBLIC_IP:=}
              ports:
                - name: http-10080
                  port: 10080
                  protocol: TCP
                  targetPort: 10080
                - name: https-10443
                  port: 10443
                  protocol: TCP
                  targetPort: 10443
