apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: drbd-alerts
spec:
  groups:
    - name: drbd.replication.alerts
      rules:
        - alert: DrbdQuorumLost
          expr: |
            drbd_device_quorum == 0
          for: 5m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: "DRBD volume {{ $labels.name }} has lost quorum on {{ $labels.instance }}"
            description: "DRBD device {{ $labels.name }} on {{ $labels.instance }} has had no quorum for more than 5 minutes. I/O on this volume is suspended: pods using it will hang in Terminating or fail to mount."

        - alert: DrbdResourceIoSuspended
          expr: |
            drbd_resource_suspended == 1
              unless on (name, pod) drbd_device_quorum == 0
          for: 2m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: "DRBD resource {{ $labels.name }} has suspended I/O on {{ $labels.pod }}"
            description: "DRBD has frozen all I/O on resource {{ $labels.name }} (satellite {{ $labels.pod }}) for more than 2 minutes: every VM whose disk is on it hangs on read and write, and kubelet cannot detach it. Quorum loss is covered by DrbdQuorumLost and excluded here; what remains is fencing or a manual `drbdadm suspend-io`. Check `drbdsetup status {{ $labels.name }} --verbose` on that node: if the peers are gone, restore the replication link first, and only if the data on this node is known-good force it out with `drbdadm --force primary` / `drbdadm resume-io`."

        - alert: DrbdConnectionNotConnected
          expr: |
            drbd_connection_state{drbd_connection_state="Connected"} == 0
          for: 5m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "DRBD connection {{ $labels.name }} -> {{ $labels.conn_name }} is not connected"
            description: "DRBD replication link for volume {{ $labels.name }} towards peer {{ $labels.conn_name }} has been down for more than 5 minutes. Check that the storage addresses recorded in LINSTOR (linstor node interface list) still match the satellites' actual NIC addresses."

        - alert: DrbdNodeReplicationDown
          expr: |
            (
              count by (pod, conn_name) (
                drbd_connection_state{drbd_connection_state="Connected"} == 0
              )
              /
              count by (pod, conn_name) (
                drbd_connection_state{drbd_connection_state="Connected"}
              )
            ) > 0.5
              and on (pod, conn_name)
            count by (pod, conn_name) (
              drbd_connection_state{drbd_connection_state="Connected"}
            ) >= 3
          for: 5m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: "Satellite {{ $labels.pod }} has lost replication to peer {{ $labels.conn_name }}"
            description: "{{ $value | humanizePercentage }} of the DRBD resources that satellite {{ $labels.pod }} replicates with peer {{ $labels.conn_name }} have been out of Connected for more than 5 minutes. This is a link-level fault, not a single volume: the peer's storage address changed (a satellite pod was recreated and the LINSTOR NetInterface still holds the old IP), the storage VLAN is down, or the peer satellite is gone. Several satellites naming the same peer point at that peer. Every affected volume runs unreplicated, or frozen if it also lost quorum (DrbdQuorumLost). Compare `linstor node interface list {{ $labels.conn_name }}` with the address on that satellite pod, then `drbdadm adjust all` on the satellites."

        - alert: DrbdForceIoFailures
          expr: |
            drbd_resource_forceiofailures == 1
          for: 10m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "DRBD resource {{ $labels.name }} is forcing I/O failures"
            description: "DRBD resource {{ $labels.name }} on {{ $labels.instance }} has been configured to force I/O failures for more than 10 minutes."

    - name: kubernetes.stuck.objects
      rules:
        - alert: PodStuckTerminating
          expr: |
            (time() - kube_pod_deletion_timestamp) > 900
          for: 5m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is stuck terminating"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been terminating for {{ $value | humanizeDuration }}. Usually a volume whose I/O is frozen, or a finalizer whose owning controller is gone."

        - alert: StuckVolumeAttachment
          expr: |
            kube_volumeattachment_status_attached == 0
          for: 15m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "VolumeAttachment {{ $labels.volumeattachment }} has not attached"
            description: "VolumeAttachment {{ $labels.volumeattachment }} (node {{ $labels.node }}) has been reporting attached=false for more than 15 minutes. The CSI attach never completed: any pod waiting on this volume is stuck in ContainerCreating."

    - name: linstor.controller.alerts
      rules:
        - alert: LinstorResourceUnhealthy
          expr: |
            linstor_resource_state < 0
          for: 10m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: "LINSTOR resource {{ $labels.name }} is unhealthy on {{ $labels.node }}"
            description: "LINSTOR reports resource {{ $labels.name }} in a bad state (linstor_resource_state={{ $value }}) on node {{ $labels.node }} for more than 10 minutes. The resource cannot assemble there: any pod scheduled to this node that needs the volume will hang in ContainerCreating."

        - alert: LinstorErrorReportStorm
          expr: |
            max by (hostname, module) (linstor_error_reports_count{hostname!=""})
              - max by (hostname, module) (linstor_error_reports_count{hostname!=""} offset 15m)
              > 10
          for: 10m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "LINSTOR is generating error reports rapidly"
            description: "The LINSTOR controller has written more than 10 error reports in 15 minutes, sustained for 10 minutes ({{ $value | printf \"%.0f\" }} in the last window). Inspect with `linstor error-reports list`; this accompanied the create-md storm in the 2026-08-18 incident."

        # (graph `@cloudless/fluence`, node #2528)
        # Aggregated by (node, storage_pool) so a controller reschedule (new pod/instance labels)
        # does not reset `for`; `total > 0` drops diskless pools (capacity 0).
        - alert: LinstorStoragePoolLowSpace
          expr: |
            max by (node, storage_pool) (linstor_storage_pool_capacity_free_bytes)
              / max by (node, storage_pool) (linstor_storage_pool_capacity_total_bytes > 0)
              < 0.20
          for: 30m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "LINSTOR storage pool {{ $labels.storage_pool }} on {{ $labels.node }} is below 20% free"
            description: "Storage pool {{ $labels.storage_pool }} on {{ $labels.node }} has had only {{ $value | humanizePercentage }} free for more than 30 minutes. The thin pool is overprovisioned: volumes promise more than it holds, and when it reaches 100% writes stop for every VM on this node at once. Free space before it gets there: move replicas off this node (place a replica on another node, then delete the one here), delete unused volumes and snapshots, or grow the pool; check `linstor storage-pool list --nodes {{ $labels.node }}`."

        - alert: LinstorStoragePoolAlmostFull
          expr: |
            max by (node, storage_pool) (linstor_storage_pool_capacity_free_bytes)
              / max by (node, storage_pool) (linstor_storage_pool_capacity_total_bytes > 0)
              < 0.10
          for: 10m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: "LINSTOR storage pool {{ $labels.storage_pool }} on {{ $labels.node }} is below 10% free"
            description: "Storage pool {{ $labels.storage_pool }} on {{ $labels.node }} has had only {{ $value | humanizePercentage }} free for more than 10 minutes. The thin pool is overprovisioned, so ordinary guest writes keep filling it; at 100% LVM stops writes and every VM on this node freezes at once. Act now: move replicas off the node or delete unused volumes and snapshots until it is back above 20%; check `linstor storage-pool list --nodes {{ $labels.node }}` and `lvs` on the node."

    # Thin-pool metadata, from lvm-exporter (lvm-exporter.yml). LINSTOR's
    # capacity metrics cover only the data area, so the pool alerts above stay
    # silent while metadata fills. Aggregated by (node, lv_uuid) so an exporter
    # restart (new pod label) does not reset `for`; lvm_lv_info adds the name.
    - name: lvm.thinpool.alerts
      rules:
        - alert: LinstorThinPoolMetadataHigh
          expr: |
            max by (node, lv_uuid) (lvm_lv_metadata_percent)
              * on (node, lv_uuid) group_left (lv_full_name)
            max by (node, lv_uuid, lv_full_name) (lvm_lv_info)
              > 75
          for: 30m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "Thin pool {{ $labels.lv_full_name }} on {{ $labels.node }} has {{ $value | printf \"%.1f\" }}% metadata used"
            description: "The metadata of thin pool {{ $labels.lv_full_name }} on {{ $labels.node }} has been above 75% for more than 30 minutes ({{ $value | printf \"%.1f\" }}%). When it reaches 100% the pool goes read-only and every VM with a replica on this node stops writing, whatever the data free space says. In the linstor-satellite pod on that node, check `vgs` and `lvs -a -o lv_name,lv_size,data_percent,metadata_percent {{ $labels.lv_full_name }}`: if the VG has free space, grow the metadata with `lvextend --poolmetadatasize +1G {{ $labels.lv_full_name }}` (leave room: LVM keeps the [*_pmspare] LV as large as the metadata); if it has none, move replicas off this node (place a replica on another node, then delete the one here) and delete unused volumes and snapshots."

        - alert: LinstorThinPoolMetadataHigh
          expr: |
            max by (node, lv_uuid) (lvm_lv_metadata_percent)
              * on (node, lv_uuid) group_left (lv_full_name)
            max by (node, lv_uuid, lv_full_name) (lvm_lv_info)
              > 90
          for: 10m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: "Thin pool {{ $labels.lv_full_name }} on {{ $labels.node }} has {{ $value | printf \"%.1f\" }}% metadata used"
            description: "The metadata of thin pool {{ $labels.lv_full_name }} on {{ $labels.node }} has been above 90% for more than 10 minutes ({{ $value | printf \"%.1f\" }}%). At 100% the pool goes read-only, every VM with a replica on this node freezes at once, and recovery needs thin_repair offline. Act now, in the linstor-satellite pod on that node: if `vgs` shows free space, `lvextend --poolmetadatasize +1G {{ $labels.lv_full_name }}` (LVM keeps the [*_pmspare] LV as large as the metadata, so it needs room for that too); otherwise move replicas off this node and delete unused volumes and snapshots until it is back below 75%."

        # Every node with a diskful LINSTOR pool must be reporting LVM state, or
        # the alerts above cannot fire for it. Covers the pod missing, the
        # scrape failing, and `lvm fullreport` itself failing (lvm_up 0).
        - alert: LvmExporterMissing
          expr: |
            max by (node) (linstor_storage_pool_capacity_total_bytes > 0)
              unless on (node)
            max by (node) (lvm_up == 1)
          for: 15m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "No LVM thin-pool data from storage node {{ $labels.node }}"
            description: "{{ $labels.node }} holds a LINSTOR storage pool but no lvm-exporter there has reported a successful LVM scan for 15 minutes, so thin-pool metadata usage on it is not watched. Check the lvm-exporter DaemonSet in storage (the node needs the beam/linstor_ready=true label) and its pod logs; a failing scan logs the lvm error and sets lvm_up to 0."
