apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: drbd-alerts
spec:
  groups:
    - name: drbd.replication.alerts
      rules:
        - alert: DrbdQuorumLost
          expr: |
            drbd_device_quorum == 0
          for: 5m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: "DRBD volume {{ $labels.name }} has lost quorum on {{ $labels.instance }}"
            description: "DRBD device {{ $labels.name }} on {{ $labels.instance }} has had no quorum for more than 5 minutes. I/O on this volume is suspended: pods using it will hang in Terminating or fail to mount."

        - alert: DrbdConnectionNotConnected
          expr: |
            drbd_connection_state{drbd_connection_state="Connected"} == 0
          for: 10m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "DRBD connection {{ $labels.name }} -> {{ $labels.conn_name }} is not connected"
            description: "DRBD replication link for volume {{ $labels.name }} towards peer {{ $labels.conn_name }} has been down for more than 10 minutes. Check that the storage addresses recorded in LINSTOR (linstor node interface list) still match the satellites' actual NIC addresses."

        - alert: DrbdLeakedLoopDevices
          expr: |
            loop_janitor_stale_loops > 0
          for: 30m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "{{ $value }} leaked loop device(s) on {{ $labels.node }} hold DRBD devices open"
            description: "kubelet left loop devices on {{ $labels.node }} whose backing path is gone but which still back a /dev/drbd* node. Each keeps that DRBD device open: when its PVC is deleted LINSTOR cannot bring the device down, peers drop their replicas, and the survivor becomes a peerless quorum:no orphan that also squats its minor and wedges later deletions. Detach them from the satellite pod: losetup -l -O NAME,BACK-INO,BACK-FILE, match BACK-INO against stat -c %i /dev/drbd*, losetup -d — or set DRY_RUN=0 on the loop-janitor DaemonSet to let it do this."

        - alert: DrbdLeakedLoopNotDetachable
          expr: |
            loop_janitor_detach_failures > 0
          for: 15m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "{{ $value }} leaked loop device(s) on {{ $labels.node }} cannot be detached"
            description: "loop-janitor found loop devices with a deleted backing path on {{ $labels.node }} that losetup -d refuses to detach. Something not modelled by the janitor still holds them; each keeps a DRBD device open and will turn into a peerless quorum:no orphan when its PVC is deleted. Inspect with losetup -l -O NAME,BACK-INO,BACK-FILE on the satellite."

        - alert: DrbdLoopJanitorStale
          expr: |
            time() - loop_janitor_last_sweep_timestamp_seconds > 1800
          for: 10m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "loop-janitor on {{ $labels.node }} has not completed a sweep in 30m"
            description: "The janitor serves metrics but its sweep loop is not finishing (losetup hanging, or an exception every pass — see the pod log). Leaked loops are accumulating unobserved on {{ $labels.node }}."

        - alert: DrbdForceIoFailures
          expr: |
            drbd_resource_forceiofailures == 1
          for: 10m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "DRBD resource {{ $labels.name }} is forcing I/O failures"
            description: "DRBD resource {{ $labels.name }} on {{ $labels.instance }} has been configured to force I/O failures for more than 10 minutes."

    - name: kubernetes.stuck.objects
      rules:
        - alert: PodStuckTerminating
          expr: |
            (time() - kube_pod_deletion_timestamp) > 900
          for: 5m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is stuck terminating"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been terminating for {{ $value | humanizeDuration }}. Usually a volume whose I/O is frozen, or a finalizer whose owning controller is gone."

        - alert: StuckVolumeAttachment
          expr: |
            kube_volumeattachment_status_attached == 0
          for: 15m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "VolumeAttachment {{ $labels.volumeattachment }} has not attached"
            description: "VolumeAttachment {{ $labels.volumeattachment }} (node {{ $labels.node }}) has been reporting attached=false for more than 15 minutes. The CSI attach never completed: any pod waiting on this volume is stuck in ContainerCreating."

    - name: linstor.controller.alerts
      rules:
        - alert: LinstorResourceUnhealthy
          expr: |
            linstor_resource_state < 0
          for: 10m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: "LINSTOR resource {{ $labels.name }} is unhealthy on {{ $labels.node }}"
            description: "LINSTOR reports resource {{ $labels.name }} in a bad state (linstor_resource_state={{ $value }}) on node {{ $labels.node }} for more than 10 minutes. The resource cannot assemble there: any pod scheduled to this node that needs the volume will hang in ContainerCreating."

        - alert: LinstorErrorReportStorm
          expr: |
            increase(linstor_error_reports_count[15m]) > 10
          for: 10m
          labels:
            team: devops
            severity: warning
          annotations:
            summary: "LINSTOR is generating error reports rapidly"
            description: "The LINSTOR controller has written more than 10 error reports in 15 minutes, sustained for 10 minutes ({{ $value | printf \"%.0f\" }} in the last window). Inspect with `linstor error-reports list`; this accompanied the create-md storm in the 2026-08-18 incident."
