apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piraeus-operator-crd
  namespace: flux-system
spec:
  interval: 10m
  path: ./config/crd
  prune: false
  sourceRef:
    kind: GitRepository
    name: piraeus-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piraeus-operator
  namespace: flux-system
spec:
  path: ./flux/apps/storage/piraeus-operator/app
  prune: false
  targetNamespace: storage
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: piraeus-operator-crd
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linstor-cluster
  namespace: flux-system
spec:
  path: ./flux/apps/storage/piraeus-operator/cluster/overlays/${NETWORK}
  prune: false
  targetNamespace: storage
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: piraeus-operator-crd
    - name: piraeus-operator
  postBuild:
    substituteFrom:
      # spectrum-vars is written by beam and carries NETWORK, plus STORAGE_VLAN
      # on clusters where beam's bootstrap supplied a storage vlan. Anything set
      # per cluster by hand — STORAGE_CIDR, STORAGE_SATELLITE_IPS, and
      # STORAGE_VLAN where beam did not provide it — lives in
      # spectrum-manual-vars, so this app has to read both.
      - kind: ConfigMap
        name: spectrum-vars
        optional: false
      - kind: ConfigMap
        name: spectrum-manual-vars
        optional: true
