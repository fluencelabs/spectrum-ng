apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piraeus-operator-crd
  namespace: flux-system
spec:
  interval: 10m
  path: ./config/crd
  prune: false
  sourceRef:
    kind: GitRepository
    name: piraeus-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piraeus-operator
  namespace: flux-system
spec:
  path: ./flux/apps/storage/piraeus-operator/app
  prune: false
  targetNamespace: storage
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: piraeus-operator-crd
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linstor-cluster
  namespace: flux-system
spec:
  path: ./flux/apps/storage/piraeus-operator/cluster/overlays/${NETWORK}
  prune: false
  targetNamespace: storage
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: piraeus-operator-crd
    - name: piraeus-operator
  postBuild:
    substituteFrom:
      # spectrum-vars is written by beam and carries NETWORK, which selects the
      # overlay path. STORAGE_SATELLITE_IPS is set per cluster by hand and lives
      # in spectrum-manual-vars, so this app has to read both.
      #
      # The storage network objects themselves — ProviderNetwork, Vlan, the linstor
      # Subnet and its NAD — are applied BY HAND on each cluster and rendered by
      # nothing: this repo dropped the Subnet and NAD in #202, and beam withdrew
      # from storage ownership entirely. On stage that is ProviderNetwork
      # `storage` on the dedicated 10G port enp16s0f1, so replication does not
      # share the workload underlay.
      #
      # STORAGE_CIDR, STORAGE_VLAN and STORAGE_MTU are therefore substituted into
      # nothing here; leftover keys in either ConfigMap are simply unread. See
      # docs/adding-a-cluster.md §3, which records the missing owner as an open
      # risk.
      - kind: ConfigMap
        name: spectrum-vars
        optional: false
      - kind: ConfigMap
        name: spectrum-manual-vars
        optional: true
