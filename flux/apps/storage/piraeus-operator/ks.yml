apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piraeus-operator-crd
  namespace: flux-system
spec:
  interval: 10m
  path: ./config/crd
  prune: false
  sourceRef:
    kind: GitRepository
    name: piraeus-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piraeus-operator
  namespace: flux-system
spec:
  path: ./flux/apps/storage/piraeus-operator/app
  prune: false
  targetNamespace: storage
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: piraeus-operator-crd
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linstor-cluster
  namespace: flux-system
spec:
  path: ./flux/apps/storage/piraeus-operator/cluster/overlays/${NETWORK}
  prune: false
  targetNamespace: storage
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: piraeus-operator-crd
    - name: piraeus-operator
  postBuild:
    substituteFrom:
      # spectrum-vars is written by beam and carries NETWORK, which selects the
      # overlay path. STORAGE_SATELLITE_IPS is set per cluster by hand and lives
      # in spectrum-manual-vars, so this app has to read both.
      #
      # The storage network objects themselves — ProviderNetwork, Vlan, Subnet,
      # NAD — are owned by beam and no longer rendered here, so STORAGE_CIDR,
      # STORAGE_VLAN and STORAGE_MTU are not substituted into anything. Leftover
      # keys in either ConfigMap are simply unread.
      - kind: ConfigMap
        name: spectrum-vars
        optional: false
      - kind: ConfigMap
        name: spectrum-manual-vars
        optional: true
