apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piraeus-operator-crd
  namespace: flux-system
spec:
  interval: 10m
  path: ./config/crd
  prune: false
  sourceRef:
    kind: GitRepository
    name: piraeus-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piraeus-operator
  namespace: flux-system
spec:
  path: ./flux/apps/storage/piraeus-operator/app
  prune: false
  targetNamespace: storage
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: piraeus-operator-crd
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linstor-cluster
  namespace: flux-system
spec:
  path: ./flux/apps/storage/piraeus-operator/cluster/overlays/${NETWORK}
  prune: false
  targetNamespace: storage
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: piraeus-operator-crd
    - name: piraeus-operator
  postBuild:
    substituteFrom:
      # spectrum-vars is written by beam and carries NETWORK, which selects the
      # overlay path. STORAGE_SATELLITE_IPS is set per cluster by hand and lives
      # in spectrum-manual-vars, so this app has to read both.
      #
      # Of the storage network objects, only the `linstor` Subnet and NAD moved to
      # beam; they are no longer rendered here. The ProviderNetwork and Vlan they
      # ride on are per-cluster hardware, applied BY HAND outside both flux and
      # beam — on stage, ProviderNetwork `storage` on the dedicated 10G port
      # enp16s0f1, so replication does not share the workload underlay. beam does
      # not recreate them and deliberately refuses to guess the Vlan: any name it
      # could substitute would be wrong in a way that looks like a repair.
      #
      # So STORAGE_CIDR, STORAGE_VLAN and STORAGE_MTU are not substituted into
      # anything here any more, but the keys must STAY in spectrum-manual-vars:
      # beam reads that ConfigMap, and turns a missing key into an error rather
      # than a default. They leave only once beam supplies them from its own
      # cluster model. See docs/adding-a-cluster.md §3.
      - kind: ConfigMap
        name: spectrum-vars
        optional: false
      - kind: ConfigMap
        name: spectrum-manual-vars
        optional: true
