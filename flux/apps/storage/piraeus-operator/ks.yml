apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piraeus-operator-crd
  namespace: flux-system
spec:
  interval: 10m
  path: ./config/crd
  prune: false
  sourceRef:
    kind: GitRepository
    name: piraeus-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piraeus-operator
  namespace: flux-system
spec:
  path: ./flux/apps/storage/piraeus-operator/app
  prune: false
  targetNamespace: storage
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: piraeus-operator-crd
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linstor-cluster
  namespace: flux-system
spec:
  path: ./flux/apps/storage/piraeus-operator/cluster/overlays/${NETWORK}
  prune: false
  targetNamespace: storage
  sourceRef:
    kind: GitRepository
    name: spectrum
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: piraeus-operator-crd
    - name: piraeus-operator
  postBuild:
    substituteFrom:
      # spectrum-vars is written by beam and carries NETWORK, which selects the
      # overlay path. The storage values — STORAGE_PREF_NIC and STORAGE_IFACE —
      # are set per cluster by hand and live in spectrum-manual-vars, so this app
      # has to read both.
      #
      # The storage network itself is a Talos VLANConfig (`storage`) in each
      # node's config patch, owned by beam; the satellite runs in hostNetwork and
      # nic-sync registers that interface's address with LINSTOR. Nothing here
      # renders network objects; leftover STORAGE_* keys are simply unread. See
      # docs/adding-a-cluster.md §3.
      - kind: ConfigMap
        name: spectrum-vars
        optional: false
      # optional: false so a cluster that never got spectrum-manual-vars fails the
      # build loudly instead of substituting STORAGE_PREF_NIC and STORAGE_IFACE to
      # empty strings. NOTE this only catches a MISSING ConfigMap: flux does not
      # fail on a present ConfigMap that lacks a key, and an unset key is
      # indistinguishable from "". A present-but-incomplete ConfigMap still
      # degrades silently — see docs/adding-a-cluster.md §3.
      - kind: ConfigMap
        name: spectrum-manual-vars
        optional: false
