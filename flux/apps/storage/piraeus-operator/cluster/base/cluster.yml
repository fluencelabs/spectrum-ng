apiVersion: piraeus.io/v1
kind: LinstorCluster
metadata:
  name: linstor-cluster
spec:
  nodeSelector:
    beam/linstor_ready: "true"

  controller:
    enabled: true

  csiController:
    enabled: true

  csiNode:
    enabled: true

  nfsServer:
    enabled: false
  
  highAvailabilityController:
    enabled: false
---
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: talos-override
spec:
  podTemplate:
    # metadata:
    #   annotations:
    #     k8s.v1.cni.cncf.io/networks: storage/linstor
    #     workload.default.ovn.kubernetes.io/logical_switch: linstor
    spec:
      initContainers:
        - name: drbd-shutdown-guard
          $patch: delete
        - name: drbd-module-loader
          $patch: delete
        # Upstream pkg/resources/satellite/satellite/daemonset.yaml, plus
        # "r|^/dev/loop|" in global_filter. Keep in sync on operator bumps.
        - name: setup-lvm-configuration
          command:
            - sh
            - -exc
            - |
              if [ -e /host/etc/lvm/lvm.conf ]; then
                if [ -d /host/etc/lvm/profile ]; then
                  cp -r /host/etc/lvm/profile /etc/lvm/
                fi
                LVM_SYSTEM_DIR=/host/etc/lvm lvmconfig --type current --mergedconfig --config 'activation { monitoring = 0 } devices { global_filter = [ "r|^/dev/drbd|", "r|^/dev/loop|" ] }' > /etc/lvm/lvm.conf
              else
                lvmconfig --type current --mergedconfig --config 'activation { udev_sync = 0 udev_rules = 0 monitoring = 0 } devices { global_filter = [ "r|^/dev/drbd|", "r|^/dev/loop|" ] obtain_device_list_from_udev = 0 }' > /etc/lvm/lvm.conf
              fi
      containers:
        - name: linstor-satellite
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LS_CONTROLLERS
              value: http://linstor-controller:3370
      volumes:
      - name: shared-data
        emptyDir: {}
      - name: run-systemd-system
        $patch: delete
      - name: run-drbd-shutdown-guard
        $patch: delete
      - name: systemd-bus-socket
        $patch: delete
      - name: lib-modules
        $patch: delete
      - name: usr-src
        $patch: delete
      - name: etc-lvm-backup
        hostPath:
          path: /var/etc/lvm/backup
          type: DirectoryOrCreate
      - name: etc-lvm-archive
        hostPath:
          path: /var/etc/lvm/archive
          type: DirectoryOrCreate
