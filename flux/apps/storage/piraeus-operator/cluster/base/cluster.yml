apiVersion: piraeus.io/v1
kind: LinstorCluster
metadata:
  name: linstor-cluster
spec:
  nodeSelector:
    beam/linstor_ready: "true"

  controller:
    enabled: true

  csiController:
    enabled: true
    # linstor-csi v1.13.2 places clone replicas from a resource cache that
    # ResourceDefinitions.Clone does not invalidate (default timeout 30s), so a
    # clone gets an extra diskful replica and its resize stalls for minutes
    # (piraeusdatastore/linstor-csi#521). A 1s cache shortens the window in
    # which placement reads stale replicas (граф `@cloudless/fluence`, узел #3352).
    # podTemplate patches args as a whole list: this is a full copy of the
    # operator's default linstor-csi args (piraeus-operator v2.12.1,
    # pkg/resources/cluster/csi-controller/csi-controller-deployment.yaml) plus
    # the cache flag. Re-check it against that file on every piraeus-operator
    # upgrade, or new default args are silently dropped.
    podTemplate:
      spec:
        containers:
          - name: linstor-csi
            args:
              - --csi-endpoint=unix://$(ADDRESS)
              - --property-namespace=$(PROPERTY_NAMESPACE)
              - --label-by-storage-pool=$(LABEL_BY_STORAGE_POOL)
              - --enable-rwx=$(ENABLE_RWX)
              - --enable-consistency-groups=$(ENABLE_CONSISTENCY_GROUPS)
              - --nfs-reactor-config-map-name=$(NFS_REACTOR_CONFIG_MAP_NAME)
              - --resource-cache-timeout=1s

  csiNode:
    enabled: true

  nfsServer:
    enabled: false
  
  highAvailabilityController:
    enabled: false

  # Thin pools take no new replica (autoplace, auto-diskful) once the volumes on
  # them would exceed 1.5x the pool size; LINSTOR's default is 20x
  # (граф `@cloudless/fluence`, узел #4157).
  properties:
    - name: MaxOversubscriptionRatio
      value: "1.5"
    # DRBD net options, values as in Cozystack's linstor chart. verify-alg lets
    # `drbdadm verify` compare replicas. Units: connect-int and ping-int in
    # seconds, ping-timeout and timeout in tenths of a second (15 s, 15 s, 2 s,
    # 10 s); DRBD requires timeout < connect-int and timeout < ping-int
    # (граф `@cloudless/fluence`, узел #4290).
    - name: DrbdOptions/Net/verify-alg
      value: "crc32c"
    - name: DrbdOptions/Net/connect-int
      value: "15"
    - name: DrbdOptions/Net/ping-int
      value: "15"
    - name: DrbdOptions/Net/ping-timeout
      value: "20"
    - name: DrbdOptions/Net/timeout
      value: "100"
---
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: talos-override
spec:
  podTemplate:
    # metadata:
    #   annotations:
    #     k8s.v1.cni.cncf.io/networks: storage/linstor
    #     workload.default.ovn.kubernetes.io/logical_switch: linstor
    spec:
      initContainers:
        - name: drbd-shutdown-guard
          $patch: delete
        - name: drbd-module-loader
          $patch: delete
      containers:
        - name: linstor-satellite
          securityContext:
            privileged: true
          volumeMounts:
            - name: lvm-conf
              mountPath: /etc/lvm/lvm.conf
              subPath: lvm.conf
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LS_CONTROLLERS
              value: http://linstor-controller:3370
      volumes:
      - name: shared-data
        emptyDir: {}
      - name: lvm-conf
        configMap:
          name: linstor-satellite-lvm-conf
      - name: run-systemd-system
        $patch: delete
      - name: run-drbd-shutdown-guard
        $patch: delete
      - name: systemd-bus-socket
        $patch: delete
      - name: lib-modules
        $patch: delete
      - name: usr-src
        $patch: delete
      - name: etc-lvm-backup
        hostPath:
          path: /var/etc/lvm/backup
          type: DirectoryOrCreate
      - name: etc-lvm-archive
        hostPath:
          path: /var/etc/lvm/archive
          type: DirectoryOrCreate
