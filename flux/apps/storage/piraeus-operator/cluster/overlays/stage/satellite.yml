# Attaches the LINSTOR satellite to the dedicated storage network so DRBD
# replication leaves the Geneve overlay.
#
# The storage network is run BY HAND, end to end. beam took ownership of it for
# one day and then withdrew (beam PR #394 reverts the whole set), so nothing
# outside this cluster creates, reconciles or supplies any part of it — the
# ProviderNetwork, the Vlan, the linstor Subnet and its NAD are all applied by a
# human, and so are the values below.
#
# Both come from spectrum-manual-vars, set at bootstrap alongside the objects
# they name: STORAGE_NAD (the `<namespace>/<name>` of the NAD, e.g.
# `storage/linstor`) and STORAGE_PREF_NIC (the LINSTOR NetInterface name). They
# are variables rather than literals so that one place per cluster describes its
# storage network, instead of the description being split between a ConfigMap
# and three overlays. The per-node address on that network is set the same way,
# but in satellite-nodes.yml — see there.
#
# None gets a default, on purpose: an empty PrefNic or NAD reference is accepted
# by the CRD and breaks replication silently, so a cluster without a storage
# network must not include this file in its overlay.
#
# ⚠️ That last sentence is a CONVENTION, not a mechanism. Every overlay includes
# this file with the same unconditional `patches: - path: satellite.yml`, and
# nothing checks it against whether the cluster actually has a storage network.
# An unset variable and an empty one are indistinguishable after substitution, so
# a cluster that includes this file without the network gets empty values, the
# pod starts, and DRBD replicates over the pod network — through Geneve and out
# the 1G management port. Nothing reports it.
#
# One step stays manual, per node, and has no declarative form in Piraeus —
# registering the interface itself:
#   linstor node interface create <node> <STORAGE_PREF_NIC> <STORAGE_SATELLITE_IP_n>
#
# ⚠️ PrefNic below and that hand-registered interface are two ends of one name,
# and nothing verifies them: PrefNic comes from STORAGE_PREF_NIC, the interface
# is created by hand. Use the same value in both. Check after adding a node:
#   linstor node interface list <node>     # the STORAGE_PREF_NIC name present
#   linstor node list-properties <node>    # PrefNic = that same name
# Piraeus only ever registers the PRIMARY pod IP (it tracks its own set in the
# node property Aux/piraeus.io/configured-interfaces) and leaves interfaces it
# did not create alone — verified on stage across a satellite restart, where it
# rewrote default-ipv4 to the new pod IP and left `storage` untouched.
#
# Upstream documents only container-network and hostNetwork
# (docs/how-to/drbd-host-networking.md), so this path is ours to maintain.
#
# The satellite's address on the storage network is deliberately NOT set here.
# A LINSTOR netinterface holds a literal IP, so the address has to survive
# satellite restarts — the same restart that showed the primary IP moving from
# 10.16.9.255 to 10.16.10.1. This file used to request it through an ip_pool
# annotation, which is a set, not a mapping: with more than one node kube-ovn is
# free to deal the same addresses out in a different order on every recreation,
# and on 2026-09-28 it did exactly that on mainnet, leaving DRBD peers pointed
# at the wrong hosts. satellite-nodes.yml now pins one address per node, keyed
# by kubernetes.io/hostname; one entry per node running a satellite, extended
# as nodes are added, which is why it lives in the overlay and not in the base.
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: talos-override
spec:
  podTemplate:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: "${STORAGE_NAD}"
  # Points DRBD replication at the interface registered above. The satellite's
  # own control connection to the controller stays on the pod network
  # (CurStltConnName remains default-ipv4) — only replication moves.
  # Overlay-scoped on purpose: on a cluster without that interface, PrefNic
  # would name a NIC that does not exist — and an unsubstituted or empty value
  # names one too, without failing the build. See the header.
  properties:
    - name: PrefNic
      value: "${STORAGE_PREF_NIC}"
