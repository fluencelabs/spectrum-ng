# Attaches the LINSTOR satellite to the dedicated storage network so DRBD
# replication can leave the Geneve overlay.
#
# This is the prerequisite, not the whole move: Piraeus registers only the
# PRIMARY pod IP with LINSTOR, so after rollout the netinterface still has to be
# created per node and selected for replication:
#   linstor node interface create <node> storage <ip>
#   linstor node set-property <node> PrefNic storage
# Upstream documents only container-network and hostNetwork
# (docs/how-to/drbd-host-networking.md), so this path is ours to maintain.
#
# ip_pool pins the address: a LINSTOR netinterface holds a literal IP, and a
# dynamically reallocated one would go stale on every satellite restart. The pool
# needs one entry per node running a satellite — extend it as nodes are added,
# which is why this lives in the overlay and not in the shared base.
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: talos-override
spec:
  podTemplate:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: storage/linstor
        linstor.storage.ovn.kubernetes.io/ip_pool: "${STORAGE_SATELLITE_IPS}"
