apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: linstor
spec:
  config: '{"cniVersion":"0.3.0","provider":"linstor.storage.ovn","server_socket":"/run/openvswitch/kube-ovn-daemon.sock","type":"kube-ovn"}'
---
# The ProviderNetwork and Vlan this subnet rides on are per-cluster hardware facts
# and live outside Flux — on stage: ProviderNetwork `storage` on enp16s0f1 (a
# dedicated 10G port, so replication does not share the workload underlay).
apiVersion: kubeovn.io/v1
kind: Subnet
metadata:
  name: linstor
spec:
  cidrBlock: ${STORAGE_CIDR}
  protocol: IPv4
  provider: linstor.storage.ovn
  logicalGateway: true
  vlan: ${STORAGE_VLAN}
