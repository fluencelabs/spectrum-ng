apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: linstor
spec:
  config: '{"cniVersion":"0.3.0","provider":"linstor.storage.ovn","server_socket":"/run/openvswitch/kube-ovn-daemon.sock","type":"kube-ovn"}'
---
apiVersion: kubeovn.io/v1
kind: Subnet
metadata:
  name: linstor
spec:
  cidrBlock: ${STORAGE_CIDR}
  protocol: IPv4
  provider: linstor.storage.ovn
  logicalGateway: true
  vlan: ${STORAGE_VLAN}
  # kube-ovn's global default is 1400, reserving room for Geneve headers on the
  # pod overlay. This subnet is a VLAN underlay — frames leave tagged with no
  # encapsulation — so that reservation is dead weight and costs DRBD ~7% more
  # packets for the same bytes.
  #
  # A property of the cluster's own link, hence a variable: set it to what the
  # storage port actually carries. Going jumbo means raising the node's
  # machine-config and the switch port first, then this.
  mtu: ${STORAGE_MTU}
