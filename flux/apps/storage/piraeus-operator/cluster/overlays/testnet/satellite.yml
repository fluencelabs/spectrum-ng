# Attaches the LINSTOR satellite to the storage network through the host: the
# satellite runs in the host network namespace, and DRBD replication leaves the
# node on a VLAN interface that Talos creates at boot (a VLANConfig document in
# the node's config patch), not on a kube-ovn attachment. Storage then keeps
# working while kube-ovn or OVS is down.
#
# Both values come from spectrum-manual-vars: STORAGE_PREF_NIC (the LINSTOR
# NetInterface name) and STORAGE_IFACE (the Talos VLANConfig name, the same on
# every node). The nic-sync sidecar registers the NetInterface from the address
# on STORAGE_IFACE, so the two names must describe the same interface.
#
# None gets a default, on purpose: an empty PrefNic is accepted by the CRD and
# breaks replication silently.
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: talos-override
spec:
  podTemplate:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
  # Points DRBD replication at the interface nic-sync registers. The satellite's
  # own control connection to the controller stays on default-ipv4.
  properties:
    - name: PrefNic
      value: "${STORAGE_PREF_NIC}"
