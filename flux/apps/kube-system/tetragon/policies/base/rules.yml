# Alerts on Tetragon's export stream in VictoriaLogs (graph @cloudless/fluence,
# #2724). Same traps as kube-ovn/observability/egress-alerts.yml: the whole
# LogsQL lives in `expr`, and the `_time:` window is wider than the interval so
# a single event survives `for:`.
# The log pipeline already unpacks Tetragon's JSON line into fields at ingest
# (process_kprobe.*, node_name) and the record has no _msg, so phrase filters
# and unpack_json match nothing: filter on the fields themselves.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: tetragon-vm-escape
  labels:
    rule-type: vlogs
spec:
  groups:
    - name: tetragon-vm-escape
      type: vlogs
      interval: 1m
      rules:
        - alert: TenantQemuExec
          expr: '_time:15m AND namespace:kube-system AND container:export-stdout AND process_kprobe.policy_name:="qemu-exec" AND -(process_kprobe.process.pod.namespace:="kube-system" AND process_kprobe.process.pod.name:tetragon-canary*) | rename process_kprobe.process.pod.namespace as tenant_namespace, process_kprobe.process.pod.name as launcher_pod, node_name as node | stats by (tenant_namespace, launcher_pod, node) count() as hits'
          for: 0m
          labels:
            team: devops
            severity: critical
            component: vm-escape
          annotations:
            summary: "qemu-kvm in {{ $labels.launcher_pod }} started a process"
            description: >-
              The qemu-kvm process of {{ $labels.launcher_pod }} in
              {{ $labels.tenant_namespace }} on {{ $labels.node }} called exec
              {{ $value }} times in the last 15 minutes. qemu never starts
              programs on its own, so this is the first step after a guest
              escape until proven otherwise (graph @cloudless/fluence, #2722).
              The workspace id is the namespace suffix. What it ran: `_time:1h
              namespace:kube-system container:export-stdout
              process_kprobe.policy_name:="qemu-exec"
              process_kprobe.process.pod.name:="{{ $labels.launcher_pod }}"`
              in VictoriaLogs. On stage the policy also kills the process
              (Sigkill), so the VM has crashed: the event's
              process_kprobe.action is KPROBE_ACTION_SIGKILL. The kill stops
              this exec, not whatever the escape did before it.
              WHAT TO DO: isolate anyway — keep the VM stopped, cordon the
              node until it is inspected — then find the owner. A hit from
              KubeVirt itself is a false positive that crashed a tenant VM:
              record it on #2729.

        - alert: TenantQemuConnect
          expr: '_time:15m AND namespace:kube-system AND container:export-stdout AND process_kprobe.policy_name:="qemu-connect" AND -(process_kprobe.process.pod.namespace:="kube-system" AND process_kprobe.process.pod.name:tetragon-canary*) | rename process_kprobe.process.pod.namespace as tenant_namespace, process_kprobe.process.pod.name as launcher_pod, node_name as node | stats by (tenant_namespace, launcher_pod, node) count() as hits'
          for: 0m
          labels:
            team: devops
            severity: critical
            component: vm-escape
          annotations:
            summary: "qemu-kvm in {{ $labels.launcher_pod }} opened an IP connection"
            description: >-
              The qemu-kvm process of {{ $labels.launcher_pod }} in
              {{ $labels.tenant_namespace }} on {{ $labels.node }} connected
              an AF_INET/AF_INET6 socket {{ $value }} times in the last 15
              minutes. qemu's own sockets are unix sockets and its NICs are
              tap fds, so an IP connect is code inside qemu reaching the
              network from the host side; the address and port are in the
              event args. The policy is observe-only, so nothing was blocked
              (graph @cloudless/fluence, #2724). The workspace id is the
              namespace suffix. Arguments: `_time:1h namespace:kube-system
              container:export-stdout
              process_kprobe.policy_name:="qemu-connect"
              process_kprobe.process.pod.name:="{{ $labels.launcher_pod }}"`
              in VictoriaLogs.
              WHAT TO DO: isolate first — stop the VM, cordon the node until
              it is inspected — then find the owner. A hit from KubeVirt
              itself is a false positive: record it on #2724 and narrow the
              policy.

        - alert: TenantQemuSetns
          expr: '_time:15m AND namespace:kube-system AND container:export-stdout AND process_kprobe.policy_name:="qemu-setns" AND -(process_kprobe.process.pod.namespace:="kube-system" AND process_kprobe.process.pod.name:tetragon-canary*) | rename process_kprobe.process.pod.namespace as tenant_namespace, process_kprobe.process.pod.name as launcher_pod, node_name as node | stats by (tenant_namespace, launcher_pod, node) count() as hits'
          for: 0m
          labels:
            team: devops
            severity: critical
            component: vm-escape
          annotations:
            summary: "qemu-kvm in {{ $labels.launcher_pod }} entered another namespace"
            description: >-
              The qemu-kvm process of {{ $labels.launcher_pod }} in
              {{ $labels.tenant_namespace }} on {{ $labels.node }} called
              setns {{ $value }} times in the last 15 minutes. qemu never
              changes namespaces; this is code inside qemu moving towards the
              host (the nstype is in the event args). The policy is
              observe-only, so nothing was blocked (graph @cloudless/fluence,
              #2724). The workspace id is the namespace suffix. Arguments:
              `_time:1h namespace:kube-system container:export-stdout
              process_kprobe.policy_name:="qemu-setns"
              process_kprobe.process.pod.name:="{{ $labels.launcher_pod }}"`
              in VictoriaLogs.
              WHAT TO DO: isolate first — stop the VM, cordon the node until
              it is inspected — then find the owner. A hit from KubeVirt
              itself is a false positive: record it on #2724 and narrow the
              policy.

        - alert: TenantQemuMount
          expr: '_time:15m AND namespace:kube-system AND container:export-stdout AND process_kprobe.policy_name:="qemu-mount" AND -(process_kprobe.process.pod.namespace:="kube-system" AND process_kprobe.process.pod.name:tetragon-canary*) | rename process_kprobe.process.pod.namespace as tenant_namespace, process_kprobe.process.pod.name as launcher_pod, node_name as node | stats by (tenant_namespace, launcher_pod, node) count() as hits'
          for: 0m
          labels:
            team: devops
            severity: critical
            component: vm-escape
          annotations:
            summary: "qemu-kvm in {{ $labels.launcher_pod }} mounted a filesystem"
            description: >-
              The qemu-kvm process of {{ $labels.launcher_pod }} in
              {{ $labels.tenant_namespace }} on {{ $labels.node }} mounted or
              moved a mount {{ $value }} times in the last 15 minutes. Mounts
              in a virt-launcher pod are made by libvirt and virt-handler,
              never by qemu; source and target are in the event args. The
              policy is observe-only, so nothing was blocked (graph
              @cloudless/fluence, #2724). The workspace id is the namespace
              suffix. Arguments: `_time:1h namespace:kube-system
              container:export-stdout process_kprobe.policy_name:="qemu-mount"
              process_kprobe.process.pod.name:="{{ $labels.launcher_pod }}"`
              in VictoriaLogs.
              WHAT TO DO: isolate first — stop the VM, cordon the node until
              it is inspected — then find the owner. A hit from KubeVirt
              itself is a false positive: record it on #2724 and narrow the
              policy.

        - alert: TenantQemuPtrace
          expr: '_time:15m AND namespace:kube-system AND container:export-stdout AND process_kprobe.policy_name:="qemu-ptrace" AND -(process_kprobe.process.pod.namespace:="kube-system" AND process_kprobe.process.pod.name:tetragon-canary*) | rename process_kprobe.process.pod.namespace as tenant_namespace, process_kprobe.process.pod.name as launcher_pod, node_name as node | stats by (tenant_namespace, launcher_pod, node) count() as hits'
          for: 0m
          labels:
            team: devops
            severity: critical
            component: vm-escape
          annotations:
            summary: "qemu-kvm in {{ $labels.launcher_pod }} reached into another process"
            description: >-
              The qemu-kvm process of {{ $labels.launcher_pod }} in
              {{ $labels.tenant_namespace }} on {{ $labels.node }} passed a
              ptrace access check against another process {{ $value }} times
              in the last 15 minutes. That is ptrace attach, opening
              /proc/<pid>/mem or /proc/<pid>/environ, process_vm_readv or
              pidfd_getfd on a process outside qemu; the target pid is in the
              event args. The policy is observe-only, so nothing was blocked
              (graph @cloudless/fluence, #2724). The workspace id is the
              namespace suffix. Arguments: `_time:1h namespace:kube-system
              container:export-stdout
              process_kprobe.policy_name:="qemu-ptrace"
              process_kprobe.process.pod.name:="{{ $labels.launcher_pod }}"`
              in VictoriaLogs.
              WHAT TO DO: isolate first — stop the VM, cordon the node until
              it is inspected — then find the owner. A hit from KubeVirt
              itself is a false positive: record it on #2724 and narrow the
              policy.

        - alert: KernelModuleLoaded
          expr: '_time:15m AND namespace:kube-system AND container:export-stdout AND process_kprobe.policy_name:="kernel-module-load" | rename process_kprobe.function_name as hook, process_kprobe.process.binary as binary, node_name as node | stats by (node, hook, binary) count() as hits'
          for: 0m
          labels:
            team: devops
            severity: warning
            component: vm-escape
          annotations:
            summary: "Kernel module load on {{ $labels.node }} by {{ $labels.binary }}"
            description: >-
              {{ $labels.binary }} triggered {{ $labels.hook }} on
              {{ $labels.node }} ({{ $value }} times in 15m). Talos loads its
              modules at boot, before Tetragon starts, so a runtime load is
              either a component autoloading one (record it) or someone with
              host privileges inserting code. Details:
              `_time:1h namespace:kube-system container:export-stdout
              process_kprobe.policy_name:="kernel-module-load"` in
              VictoriaLogs.

        # The canary runs every 10 minutes; 30m without its event means the
        # detector is blind, and every other alert here is silent for the same
        # reason, not because nothing happened. It filters on the same field paths
        # TenantQemuExec does, so a renamed field (in Tetragon's JSON or in how
        # the pipeline stores it) blinds this alert's query too and it fires,
        # instead of TenantQemuExec silently matching nothing.
        - alert: TetragonCanarySilent
          expr: '_time:30m AND namespace:kube-system AND container:export-stdout AND process_kprobe.policy_name:="qemu-exec" AND process_kprobe.process.pod.namespace:="kube-system" AND process_kprobe.process.pod.name:tetragon-canary* | stats count() as hits | filter hits:=0'
          for: 10m
          labels:
            team: devops
            severity: warning
            component: vm-escape
          annotations:
            summary: "VM escape detector is blind: no canary event for 30m"
            description: >-
              The tetragon-canary CronJob makes a process at
              /usr/libexec/qemu-kvm exec `true` every 10 minutes, and its event
              has not reached VictoriaLogs in 30 minutes. Walk the path:
              `kubectl -n kube-system get cronjob tetragon-canary` (is it
              running?), `kubectl -n kube-system get tracingpolicies`
              (is qemu-exec loaded?), `kubectl -n kube-system logs ds/tetragon
              -c export-stdout` (is Tetragon exporting?), then Alloy and
              VictoriaLogs.
