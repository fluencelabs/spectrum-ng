# qemu-kvm in a virt-launcher pod never starts another program: its parent is
# virt-launcher-monitor and its only children are threads. Any exec it makes is
# the first step after a guest-to-host escape (graph @cloudless/fluence, #2722).
# In security_bprm_check, matchBinaries is the CALLER (the process about to be
# replaced), not the binary being executed.
# Enforcing on stage: Sigkill kills the whole qemu process, so a false positive
# crashes that tenant VM (#2729). Sigkill goes through bpf_send_signal and needs
# no bpf_override_return, which this kernel lacks. Post comes first so the
# exported event carries action KPROBE_ACTION_SIGKILL (the last action run).
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: qemu-exec
spec:
  kprobes:
    - call: security_bprm_check
      syscall: false
      args:
        - index: 0
          type: linux_binprm
      selectors:
        - matchBinaries:
            - operator: In
              values:
                - /usr/libexec/qemu-kvm
          matchActions:
            - action: Post
            - action: Sigkill
---
# Talos loads its modules at boot, before Tetragon runs; at runtime a module
# load or an autoload request is unexpected on any node.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: kernel-module-load
spec:
  kprobes:
    - call: security_kernel_module_request
      syscall: false
      args:
        - index: 0
          type: string
    - call: security_kernel_read_file
      syscall: false
      args:
        - index: 0
          type: file
        - index: 1
          type: int
      selectors:
        - matchArgs:
            - index: 1
              operator: Equal
              values:
                - "2" # READING_MODULE (finit_module)
    - call: security_kernel_load_data
      syscall: false
      args:
        - index: 0
          type: int
      selectors:
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - "2" # LOADING_MODULE (init_module)
