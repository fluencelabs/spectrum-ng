apiVersion: v1
kind: ConfigMap
metadata:
  name: ovs-ipfix-config
data:
  ensure.sh: |
    #!/bin/bash
    set -u
    BRIDGE=${BRIDGE:-br-int}
    TARGET=${TARGET:-127.0.0.1:4739}
    SAMPLING=${SAMPLING:-64}
    ACTIVE_TIMEOUT=${ACTIVE_TIMEOUT:-30}
    MAX_FLOWS=${MAX_FLOWS:-65536}
    want="[\"$TARGET\"] $SAMPLING $ACTIVE_TIMEOUT $MAX_FLOWS {enable-input-sampling=\"true\", enable-output-sampling=\"false\", enable-tunnel-sampling=\"false\"}"
    applied=0
    while true; do
      if ! ovs-vsctl --timeout=5 br-exists "$BRIDGE"; then
        echo "$(date -Is) bridge $BRIDGE absent, waiting"
        sleep 30; continue
      fi
      row=$(ovs-vsctl --timeout=5 get Bridge "$BRIDGE" ipfix 2>/dev/null)
      have=""
      if [ -n "$row" ] && [ "$row" != "[]" ]; then
        have=$(ovs-vsctl --timeout=5 get IPFIX "$row" targets sampling cache_active_timeout cache_max_flows other_config 2>/dev/null | tr '\n' ' ' | sed 's/ $//')
      fi
      if [ "$have" != "$want" ]; then
        if ovs-vsctl --timeout=5 -- --id=@i create IPFIX \
            targets="\"$TARGET\"" sampling="$SAMPLING" \
            obs_domain_id=1 obs_point_id=1 \
            cache_active_timeout="$ACTIVE_TIMEOUT" cache_max_flows="$MAX_FLOWS" \
            template_interval=60 \
            other_config:enable-tunnel-sampling=false \
            other_config:enable-input-sampling=true \
            other_config:enable-output-sampling=false \
            -- set Bridge "$BRIDGE" ipfix=@i >/dev/null; then
          applied=$((applied+1))
          echo "$(date -Is) ipfix applied on $BRIDGE -> $TARGET sampling=1/$SAMPLING (apply #$applied, previous: ${have:-none})"
        else
          echo "$(date -Is) ipfix apply on $BRIDGE FAILED"
        fi
      fi
      sleep 30
    done
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ovs-ipfix
  labels:
    app.kubernetes.io/name: ovs-ipfix
    app.kubernetes.io/part-of: kube-ovn-flows
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ovs-ipfix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ovs-ipfix
        app.kubernetes.io/part-of: kube-ovn-flows
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: ensure
          image: docker.io/kubeovn/kube-ovn:v1.16.3
          command: ["/bin/bash", "/config/ensure.sh"]
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /config
            - name: host-run-ovs
              mountPath: /run/openvswitch
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: ovs-ipfix-config
        - name: host-run-ovs
          hostPath:
            path: /run/openvswitch
            type: Directory
