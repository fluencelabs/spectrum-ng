apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netobserv-ebpf-syn
  labels:
    app.kubernetes.io/name: netobserv-ebpf-syn
    app.kubernetes.io/part-of: kube-ovn-flows
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netobserv-ebpf-syn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netobserv-ebpf-syn
        app.kubernetes.io/part-of: kube-ovn-flows
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: quay.io/netobserv/netobserv-ebpf-agent:v1.12.0-community
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["BPF", "PERFMON", "NET_ADMIN"]
          env:
            - name: EXPORT
              value: ipfix+udp
            - name: TARGET_HOST
              value: 127.0.0.1
            - name: TARGET_PORT
              value: "4740"
            - name: INTERFACES
              value: "/_h$/"
            - name: FLOW_FILTER_RULES
              value: '[{"ip_cidr":"0.0.0.0/0","protocol":"TCP","tcp_flags":"SYN","action":"Accept","sample":1}]'
            - name: CACHE_ACTIVE_TIMEOUT
              value: 30s
            - name: CACHE_MAX_FLOWS
              value: "65536"
            - name: METRICS_ENABLE
              value: "true"
            - name: METRICS_SERVER_PORT
              value: "4793"
            - name: LOG_LEVEL
              value: info
          ports:
            - name: metrics
              containerPort: 4793
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: netobserv-ebpf-syn
  labels:
    app.kubernetes.io/name: netobserv-ebpf-syn
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: netobserv-ebpf-syn
  ports:
    - name: metrics
      port: 4793
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: netobserv-ebpf-syn
  labels:
    scrape: "true"
spec:
  endpoints:
    - port: metrics
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: netobserv-ebpf-syn
---
