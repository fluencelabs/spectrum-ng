# Health of the two flow probes, nothing about tenants yet. Both rules are the
# evidence NKS #1830 asks for: if kube-ovn ever drops the IPFIX row, the OVS
# probe goes silent while the eBPF one keeps reporting, and the alert names the
# probe that died.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kube-ovn-flows
spec:
  groups:
    - name: kube-ovn-flows
      interval: 1m
      rules:
        # goflow2 counts IPFIX packets per probe container (ServiceMonitor sets
        # `probe`). A probe that stopped is the one whose counter stopped
        # moving; a probe that never started has no series at all — absent()
        # keeps the selector's labels, so both alerts name the probe.
        - alert: FlowProbeSilent
          expr: sum by (probe, instance) (rate(flow_traffic_packets_total[10m])) == 0
          for: 15m
          labels:
            team: devops
            severity: warning
            component: flow-observability
          annotations:
            summary: "Flow probe {{ $labels.probe }} has exported nothing for 15m"
            description: >-
              goflow2 on {{ $labels.instance }} has received no IPFIX packets from
              the {{ $labels.probe }} probe for 15 minutes. For ovs that means the
              IPFIX row on br-int is gone or the exporter is wedged — check
              `kubectl -n kube-system logs ds/ovs-ipfix` for re-apply lines (each
              one is a data point for NKS #1830) and `ovs-vsctl list IPFIX` in the
              ovs-ovn pod. For ebpf check `kubectl -n kube-system logs
              ds/netobserv-ebpf-agent`.

        - alert: FlowProbeMissing
          expr: |
            absent(flow_traffic_packets_total{probe="ovs"})
            or absent(flow_traffic_packets_total{probe="ebpf"})
          for: 15m
          labels:
            team: devops
            severity: warning
            component: flow-observability
          annotations:
            summary: "Flow probe {{ $labels.probe }} is not being scraped"
            description: >-
              No goflow2 series for probe {{ $labels.probe }}: the goflow2
              DaemonSet is down, the ServiceMonitor is not matched, or the
              collector container never started. `kubectl -n kube-system get
              ds goflow2` first.
