apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kube-ovn-abuse
spec:
  groups:
    - name: tenant-vm-traffic
      interval: 1m
      rules:
        - record: tenant:vm_info
          expr: |
            max by (pod_name, pod_namespace, vm_id, workspace_id) (
              label_replace(
                label_replace(
                  kube_customresource_kubevirt_vm_annotation_info{exported_namespace=~"workspace-.*"},
                  "pod_name", "$1", "name", "(.*)"),
                "pod_namespace", "$1", "exported_namespace", "(.*)")
            )

        - record: tenant:vm_egress_bits:rate5m
          expr: |
            sum by (pod_name, pod_namespace, vm_id, workspace_id) (
              rate(kube_ovn_interface_tx_bytes{pod_namespace=~"workspace-.*"}[5m]) * 8
            )
            * on (pod_name, pod_namespace) group_left (vm_id, workspace_id)
            tenant:vm_info

        - record: tenant:vm_ingress_bits:rate5m
          expr: |
            sum by (pod_name, pod_namespace, vm_id, workspace_id) (
              rate(kube_ovn_interface_rx_bytes{pod_namespace=~"workspace-.*"}[5m]) * 8
            )
            * on (pod_name, pod_namespace) group_left (vm_id, workspace_id)
            tenant:vm_info

        - record: tenant:vm_egress_packets:rate5m
          expr: |
            sum by (pod_name, pod_namespace, vm_id, workspace_id) (
              rate(kube_ovn_interface_tx_packets{pod_namespace=~"workspace-.*"}[5m])
            )
            * on (pod_name, pod_namespace) group_left (vm_id, workspace_id)
            tenant:vm_info

        - record: tenant:vm_egress_avg_packet_bytes
          expr: |
            tenant:vm_egress_bits:rate5m / 8
            / (tenant:vm_egress_packets:rate5m > 0)

    - name: tenant-vm-abuse
      interval: 1m
      rules:
        - alert: TenantVmEgressBitrateHigh
          expr: tenant:vm_egress_bits:rate5m > 100e6
          for: 15m
          labels:
            team: devops
            severity: warning
            component: tenant-abuse
            signal: bitrate
          annotations:
            summary: "VM {{ $labels.vm_id }} is pushing {{ $value | humanize }}bit/s outbound"
            suspected_cause: >-
              Participation in an outbound DDoS, content seeding, or a
              legitimate upload. This signal is volumetric and does not
              distinguish intent on its own — read it together with
              signal=flood and signal=asymmetry on the same VM.
            description: >-
              vm_id={{ $labels.vm_id }} workspace_id={{ $labels.workspace_id }}
              (kubevirt {{ $labels.pod_name }} in {{ $labels.pod_namespace }})
              has held {{ $value | humanize }}bit/s outbound for over 15
              minutes.
              WHAT TO DO: resolve the owner from vm_id (admin-app, search by
              resource); if abuse is confirmed, throttle the port via the
              ovn.kubernetes.io/egress_rate annotation on the subnet or port
              before escalating to removing egress altogether.
              LIMIT OF THIS STAGE: where the traffic is going is not visible
              here — interface counters do not know the destination.

        - alert: TenantVmSmallPacketFlood
          expr: |
            tenant:vm_egress_packets:rate5m > 5000
            and tenant:vm_egress_avg_packet_bytes < 150
          for: 10m
          labels:
            team: devops
            severity: critical
            component: tenant-abuse
            signal: flood
          annotations:
            summary: "VM {{ $labels.vm_id }} is emitting small packets in bulk — likely a scan or SYN flood"
            suspected_cause: >-
              Port or subnet scanning, a SYN flood, or participation in an
              amplification attack. An average outbound packet under 150 bytes
              at high pps is a shape useful transfer does not produce.
            description: >-
              vm_id={{ $labels.vm_id }} workspace_id={{ $labels.workspace_id }}
              (kubevirt {{ $labels.pod_name }} in {{ $labels.pod_namespace }})
              is sending {{ $value | humanize }} packets/s averaging under 150
              bytes.
              THIS IS THE WORST SIGNAL OF STAGE ONE — it strikes other people's
              networks and leads to upstream abuse complaints and our public
              block landing on blocklists. WHAT TO DO: confirm the owner from
              vm_id and throttle the port immediately, without waiting for a
              full diagnosis.

        - alert: TenantVmEgressAsymmetry
          expr: |
            tenant:vm_egress_bits:rate5m > 10e6
            and
            tenant:vm_egress_bits:rate5m > 20 * tenant:vm_ingress_bits:rate5m
          for: 30m
          labels:
            team: devops
            severity: warning
            component: tenant-abuse
            signal: asymmetry
          annotations:
            summary: "VM {{ $labels.vm_id }} is sending 20x more than it receives"
            suspected_cause: >-
              Bulk mailing (spam), an outbound flood, or content seeding. A
              client workload normally receives more than it sends; a sustained
              inversion at meaningful volume means the VM is acting as a source
              rather than a consumer.
            description: >-
              vm_id={{ $labels.vm_id }} workspace_id={{ $labels.workspace_id }}
              (kubevirt {{ $labels.pod_name }} in {{ $labels.pod_namespace }})
              has sent {{ $value | humanize }}bit/s for over 30 minutes against
              an inbound stream 20x smaller.
              WHAT TO DO: if signal=flood is firing alongside this, it is a
              scan — work that one. If not, mailing is more likely; telling
              spam from legitimate seeding is IMPOSSIBLE from counters alone
              and needs a destination port, which is stage two.

        - alert: TenantAbuseSignalsMissing
          expr: |
            absent(tenant:vm_egress_bits:rate5m)
            and on () (count(tenant:vm_info) > 0)
          for: 30m
          labels:
            team: devops
            severity: warning
            component: tenant-abuse
            signal: liveness
          annotations:
            summary: "Tenant abuse signals have gone dark while tenant VMs exist"
            description: >-
              tenant:vm_egress_bits:rate5m has produced no series for 30
              minutes although tenant:vm_info still lists VMs, so this is not
              an empty cluster: the join that resolves an interface to a vm_id
              has stopped matching, and a label rename on either side is enough
              to do it. Every abuse alert in this file is built on that series,
              so while it is absent they are all unable to fire, and their
              quiet is indistinguishable from an absence of abuse. Compare
              count(kube_ovn_interface_tx_bytes{pod_namespace=~"workspace-.*"})
              with count(tenant:vm_info) to see which side went away.

        - alert: TenantAbuseCoveragePartial
          expr: |
            count(tenant:vm_egress_bits:rate5m)
            < 0.9 * count(count by (pod_name, pod_namespace) (
                kube_ovn_interface_tx_bytes{pod_namespace=~"workspace-.*"}
              ))
          for: 30m
          labels:
            team: devops
            severity: warning
            component: tenant-abuse
            signal: liveness
          annotations:
            summary: "Abuse signals cover only part of the running tenant VMs"
            description: >-
              {{ $value }} VMs carry abuse signals while more than that have
              live interface counters, so some VMs resolve to no vm_id and are
              silently unpoliced. TenantAbuseSignalsMissing only catches total
              loss; this catches the partial case, which is the more likely one
              — a VM whose annotation metadata is missing, stale or not yet
              scraped drops out of the join on its own, and nothing else says
              so.
