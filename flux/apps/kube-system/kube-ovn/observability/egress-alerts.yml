# Egress attachment failures have no metric and no CR status to read: when
# kube-ovn cannot connect a tenant VPC to the shared egress fabric, the cloudless
# Subnet and VirtualMachine CRs still report Ready=True, the VPC still gets its
# default route, the per-subnet OvnSnatRule still reports READY=true, and even the
# lrp-type OvnEip reports ready=true for an address it never bound. The lightmare
# controller logs nothing. Only kube-ovn-controller knows, and only in its log —
# hence a vlogs rule.
#
# Found on 2026-08-19: a VM sat on a VPC with no fabric port and no egress for
# hours; ovn-trace showed its packets being sent back out the only port the router
# owned and dropped. Root cause was the node label
# `ovn.kubernetes.io/external-gw=true` being absent, so kube-ovn had no chassis to
# place the external LRP on.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kube-ovn-egress-logs
  labels:
    # Evaluated by the `stack-logs` VMAlert against vlogs; the metrics instance
    # excludes this label.
    rule-type: vlogs
spec:
  groups:
    - name: kube-ovn-egress-logs
      type: vlogs
      interval: "60s"
      rules:
        # The whole LogsQL lives in `expr`. It must NOT be split into
        # `params.query` + `expr: '* | ...'` — vmalert sends `expr` to the
        # datasource and never applies the params filter, so `*` would match every
        # log line in the cluster.
        - alert: VpcEgressFabricAttachFailing
          # `_time:30m`, deliberately much wider than the 60s interval: kube-ovn
          # retries a VPC sync only about every 16 minutes, so a 5m window is empty
          # between retries and the alert would never survive its own `for:`. That
          # is exactly how KubePodCrashLooping failed to latch on a pod restarting
          # every 4.5 minutes.
          expr: '_time:30m AND namespace:kube-system AND container:kube-ovn-controller AND "no external gw nodes" | stats count(*) as hits | filter hits:>0'
          for: 5m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: A VPC cannot be attached to the egress fabric — new tenants get no egress.
            description: >-
              kube-ovn-controller reports `no external gw nodes` ({{ $value }} times in
              the last 30m), so it cannot create the external logical router port that
              carries a tenant VPC to the egress fabric. VPCs attached before this
              started keep working; every VPC created while it lasts silently has no
              egress, with all CRs reporting Ready. Usual cause: no node carries
              `ovn.kubernetes.io/external-gw=true`. Confirm with
              `kubectl get nodes -L ovn.kubernetes.io/external-gw`, and check a
              suspect VPC has TWO router ports (its tenant subnet AND the fabric):
              `kubectl -n kube-system exec <ovn-central-pod> -c ovn-central -- ovn-nbctl show <vpc>`.
---
# The outcome-side alert, and the only one that would have caught the second
# failure of 2026-08-19.
#
# That day the egress hub VPC was still attached to `subnet-temp`, the public /29
# on the legacy VLAN 121, which had been deleted when the public network moved to
# VLAN 400. The hub kept a router port with an address on it, peered to a logical
# switch that no longer existed, so EVERY tenant lost egress — including VPCs
# whose own fabric attachment was perfectly healthy.
#
# Nothing reported it. kube-ovn logged no error for the hub (VpcEgressFabricAttachFailing
# above stayed silent, correctly — attachment was not what failed). Every cloudless
# CR read Ready. There are no kube-ovn CR metrics here to compare
# `Vpc.spec.extraExternalSubnets` against the Subnets that exist. `ovn-trace` even
# reported a complete path, because it simulates the logical pipeline and cannot
# know the far side is gone.
#
# What did expose it was the guest: cloud-init installs qemu-guest-agent from the
# Ubuntu archive, so a VM with no egress spends 250-420s timing out and gives up.
# Alerting on that covers this cause and any future one, at the cost of only
# firing once someone boots a VM — which is also when it starts to matter.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: tenant-egress-guest-logs
  labels:
    rule-type: vlogs
spec:
  groups:
    - name: tenant-egress-guest-logs
      type: vlogs
      interval: "60s"
      rules:
        - alert: TenantVmCannotResolveDns
          # `Temporary failure resolving` is glibc's EAI_AGAIN: the query left and
          # nothing came back. It is NOT evidence that DNS itself is misconfigured
          # — the guests are handed 1.1.1.1 and 8.8.8.8, which are only reachable
          # over egress, so loss of egress presents as a resolver failure. Do not
          # start by auditing resolv.conf; check the path out.
          #
          # 30m window against a 60s interval: a failing guest logs these across a
          # ~7 minute cloud-init, and VMs boot sporadically, so a short window
          # would fall between them and the alert would never hold its `for:`.
          # hits:>5 so one unlucky guest with a broken image does not page.
          #
          # COVERAGE IS PARTIAL, and this alert staying silent is NOT evidence
          # that egress works. The lines only exist for VMs whose virt-launcher
          # carries the `guest-console-log` container (KubeVirt `logSerialConsole`);
          # on kabat-stage on 2026-08-26 that was 4 of 18 running VMs. Enabling it
          # fleet-wide was considered and rejected: the write rate is controlled by
          # the guest, so one noisy tenant can evict the whole cluster's logs from a
          # 10Gi PVC, and guest consoles carry tenant data into the shared Grafana.
          # The durable fixes are a canary VM we own and a CR-consistency metric,
          # not more guest logging.
          #
          # `stats by (namespace, pod)` — the threshold is PER VM. A cluster-wide
          # count summed unrelated guests, so two or three VMs on subnets with no
          # egress at all could raise a critical between them without any one of
          # them being broken. That is a supported configuration, not a fault: on
          # kabat-stage 8 of 18 cloudless Subnets carry no `spec.egress`, and their
          # guests legitimately cannot resolve. There is no way to exclude them in
          # the query — the log stream carries only namespace/pod/container, and the
          # VM's subnet lives in a pod annotation whose key is dynamic, so Alloy
          # cannot relabel it. Grouping at least names the VM in the alert.
          # See the description for what to check first.
          #
          # `container:guest-console-log` costs no coverage: over 7 days every single
          # `Temporary failure resolving` line in vlogs came from that container.
          expr: '_time:30m AND container:guest-console-log AND "Temporary failure resolving" | stats by (namespace, pod) count(*) as hits | filter hits:>5'
          for: 5m
          labels:
            team: devops
            severity: critical
          annotations:
            summary: A tenant VM cannot reach the internet — cloud-init is failing in the guest.
            description: >-
              {{ $value }} DNS resolution failures in the console of VM
              `{{ $labels.pod }}` (namespace `{{ $labels.namespace }}`) in the last
              30m. First rule out the supported case: a VM on a Subnet with no
              `spec.egress` has no path out by design and will log exactly this —
              check with `kubectl get clsn -o yaml` for the workspace before chasing
              the network. Otherwise the VM booted and reports Ready, but cloud-init
              cannot fetch packages, so
              qemu-guest-agent is never installed and vm-api's password setting fails
              with `409 qemu-guest-agent not connected` forever after. Check the egress
              path end to end, starting at the hub: `ovn-nbctl show ovn-egress-test`
              must have a port on a Subnet that still EXISTS (`kubectl get subnet.kubeovn.io`)
              with a gateway chassis, and its SNAT address must belong to that subnet.
              A green `ovn-trace` does not rule this out — it simulates the logical
              pipeline and reports success even when the peer switch is gone.
