apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-ovn
spec:
  interval: 30m
  # Helm never upgrades what it installed from a chart's crds/ directory, so
  # without this the CRDs stay frozen at whatever version first installed them
  # while the controllers keep being upgraded. On stage that gap had grown far
  # enough to hide fields the running daemon already reads — the
  # ProviderNetwork CRD carried neither `autoCreateVlanSubinterfaces` nor
  # `vlanInterfaces`, so a whole VLAN-subinterface feature looked like it did
  # not exist. CreateReplace makes flux apply the chart's CRDs on every upgrade.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: kube-ovn-v2
      # The image tag is NOT set here: kube-ovn-v2 reads it from
      # `global.images.kubeovn.tag`, whose default is the chart's own
      # appVersion. A top-level `images.kubeovn.tag` (as this file carried
      # until 1.15.23) is silently ignored, so the daemons have always
      # followed the chart version alone — this line is the only lever.
      version: 1.16.12
      sourceRef:
        kind: HelmRepository
        name: kube-ovn
        namespace: flux-system
  values:
    features:
      enableLoadbalancerService: true
      # Egress gate: enables OvnEip / VPC enableExternal (--enable-external-vpc).
      # Per-cluster via ${ENABLE_EXTERNAL_VPCS} (spectrum-vars); default off so
      # clusters that don't set the var are unaffected.
      enableExternalVpcs: ${ENABLE_EXTERNAL_VPCS:=false}
      # AdminNetworkPolicy / BaselineAdminNetworkPolicy (--enable-anp). ANP
      # ACLs sit in OVN ACL tier 1, ahead of the tier-2 allow kube-ovn gives
      # every pod to its own node's IP and join IP — the one rule a
      # NetworkPolicy (tier 2, lower priority) cannot override. lightmare's
      # chart ships the ANP that closes that path for workspace pods.
      #
      # On every cluster: with no ANP object it adds three informers and no
      # ACL, so the switch is inert until lightmare's per-cluster values enable
      # its policy. Needs the CRDs from network-policy-api-crds (dependsOn in
      # ../ks.yml).
      ENABLE_ANP: true

    agent:
      # Interface carrying inter-node Geneve traffic (--iface). Empty keeps
      # kube-ovn's default — the interface holding the node IP, which on every
      # Kabat node today is the 1G management port, so all pod-to-pod east-west
      # shares it with the control plane while the 10G ports carry only the
      # public and storage VLANs.
      #
      # Moving it takes an address on the data VLAN first (a Talos
      # machine-config fact owned by beam, not something this repo can assert),
      # hence a per-cluster variable: set it to that interface — `br-underlay`
      # when the address lands on a port kube-ovn has taken into a provider
      # bridge, since kube-ovn migrates the address there.
      interface: "${OVN_TUNNEL_IFACE:=}"

    masterNodesLabels:
      kube-ovn/role: null
      node-role.kubernetes.io/control-plane: ""

    networking:
      stack: "IPv4"
      services:
        cidr:
          # Renders --service-cluster-ip-range, which is how kube-ovn decides
          # what counts as service traffic. It is NOT the apiserver's setting —
          # the real range comes from Talos (`cluster.network.serviceSubnets`)
          # and belongs to whoever provisions the cluster, so the two can drift
          # apart silently: the chart's default is 10.96.0.0/12 while a cluster
          # may well serve 10.112.0.0/12, and nothing complains.
          #
          # Per-cluster, defaulting to the chart's value so a cluster that sets
          # nothing keeps today's behaviour. Read it off the cluster rather than
          # assuming — `kubectl -n default get svc kubernetes` names the range
          # the apiserver actually allocates from.
          v4: "${SERVICE_CIDR:=10.96.0.0/12}"
      pods:
        # Pod MTU on overlay subnets (--mtu). 0 keeps kube-ovn's default: the
        # MTU of the tunnel interface minus the Geneve overhead. Moving the
        # tunnel to a jumbo interface would then hand new pods a jumbo MTU while
        # running ones keep the old one, and a mixed MTU inside one OVN logical
        # switch silently drops large UDP — so a cluster moving its tunnel pins
        # the current value here first (graph @cloudless/fluence, node #2502).
        mtu: ${OVN_POD_MTU:=0}

    ovsOvn:
      disableModulesManagement: true
      ovsDirectory: "/var/lib/openvswitch"
      ovnDirectory: "/var/lib/ovn"
      # Guaranteed QoS with an integer CPU count: kubelet's static CPU manager
      # then gives ovs-vswitchd a fixed exclusive cpuset. As Burstable it sat in
      # the shared pool, which shrinks and grows whenever a dedicated-CPU VM
      # starts or stops, and OVS in per-cpu upcall mode tears down and recreates
      # every handler thread (~640 on a 768-core node) on each change, losing
      # upcalls meanwhile (DatapathFlowsLost). Must stay an integer — a
      # fractional value keeps the pod in the shared pool. The init container
      # also needs requests == limits for the pod to be Guaranteed
      # (postRenderers below).
      resources:
        requests:
          cpu: "${OVS_OVN_CPU:=2}"
          memory: "3Gi"
        limits:
          cpu: "${OVS_OVN_CPU:=2}"
          memory: "3Gi"
    cni:
      mountToolingDirectory: false

  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: kube-ovn-pinger
            patch: |
              - op: add
                path: /spec/template/spec/hostPID
                value: true
          - target:
              kind: Deployment
              name: kube-ovn-monitor
            patch: |
              - op: add
                path: /spec/template/spec/hostPID
                value: true
          - target:
              kind: Deployment
              name: ovn-central
            patch: |
              - op: add
                path: /spec/template/spec/hostPID
                value: true
          # The chart gives hostpath-init no resources and no value to set
          # them; without these the ovs-ovn pod is Burstable whatever
          # ovsOvn.resources says. CPU equals the main container's, so the pod's
          # effective request does not change. The test op fails the release
          # instead of patching the wrong container if the chart puts another
          # one first.
          - target:
              kind: DaemonSet
              name: ovs-ovn
            patch: |
              - op: test
                path: /spec/template/spec/initContainers/0/name
                value: hostpath-init
              - op: add
                path: /spec/template/spec/initContainers/0/resources
                value:
                  requests:
                    cpu: "${OVS_OVN_CPU:=2}"
                    memory: "128Mi"
                  limits:
                    cpu: "${OVS_OVN_CPU:=2}"
                    memory: "128Mi"
