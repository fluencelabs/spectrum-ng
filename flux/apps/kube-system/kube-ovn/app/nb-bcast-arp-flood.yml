apiVersion: batch/v1
kind: CronJob
metadata:
  name: ovn-nb-bcast-arp-flood
  namespace: kube-system
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 180
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: nbctl
              image: docker.io/kubeovn/kube-ovn:v1.16.8
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  DB="tcp:[ovn-nb.kube-system]:6641"
                  for OPT in bcast_arp_nd_req_flood bcast_arp_req_flood; do
                    RAW=$(ovn-nbctl --db="$DB" --timeout=30 --if-exists get NB_Global . "options:$OPT")
                    CUR=$(printf '%s' "$RAW" | tr -d '"')
                    if [ "$CUR" = "true" ]; then
                      echo "$OPT=true already"
                    else
                      ovn-nbctl --db="$DB" --timeout=30 set NB_Global . "options:$OPT=true"
                      echo "$OPT set to true (was '${CUR:-unset}')"
                    fi
                  done
