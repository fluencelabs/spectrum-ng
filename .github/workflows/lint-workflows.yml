name: lint workflows

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/renovate.json"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint actions
        uses: reviewdog/action-actionlint@v1
        env:
          SHELLCHECK_OPTS: "-e SC2086 -e SC2207 -e SC2128"
        with:
          reporter: github-pr-check
          fail_level: error

  renovate:
    runs-on: ubuntu-latest
    # The validator of the Renovate release that reads the config: the
    # tj-actions wrapper ran a years-old Renovate that rejected current options.
    container:
      image: ghcr.io/renovatebot/renovate:44
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Renovate Config Validator
        run: renovate-config-validator --strict --no-global .github/renovate.json
